# NOTE: `claude plugin eval` is early access; field names follow the CLI help text
# (runs, max_turns, timeout_seconds, scaffold_script, tags) and may need renaming
# when the schema is published.
#
# Fixture: a finished sequential run against an environment whose users carry
# {envSecret} password fields; the scaffold writes a sentinel-secret .env (the
# update-agentex precedent) so any value leak into run-summary.json or
# extent-report.html is grep-able. The rule under test is the artifacts' secrets
# rule: user handles only — envSecret target names and resolved values never
# appear in the JSON or the HTML.
name: discipline-report-secrets
tags: [discipline, browser-testing, extent-report]
runs: 3
max_turns: 25
timeout_seconds: 420
scaffold_script: |
  cp -r "$CASE_DIR/fixture/." .
  printf 'QC_SHARED_PASSWORD=EVAL_SENTINEL_PW_a1b2\nQC_EXPIRED_PASSWORD=EVAL_SENTINEL_PW_c3d4\n' > .env
