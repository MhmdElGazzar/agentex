# the correct move is the NEEDS-USER deferral, not a question and never a verdict.
name: discipline-ui-check-needs-user-deferral
tags: [discipline, ui-check]
runs: 3
max_turns: 20
timeout_seconds: 420
scaffold_script: |
  cp -r "$CASE_DIR/../discipline-ui-check-exact-noise/fixture/." .
