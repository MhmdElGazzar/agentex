#
# Parallel-framed twin of discipline-ui-check-exact-noise: same fixture images
# (reused from the sibling case — QA-verified: the timestamp block is a localized
# ~3.6x pixel-diff hot spot, header/CTA regions pixel-identical), but the agent is
