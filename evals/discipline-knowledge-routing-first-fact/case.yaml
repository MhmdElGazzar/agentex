# NOTE: `claude plugin eval` is early access; field names follow the CLI help text
# (runs, max_turns, timeout_seconds, scaffold_script, tags) and may need renaming
# when the schema is published.
#
# The same routing rule on a project with no knowledge/ yet: the first fact creates exactly
# knowledge/business-rules.md and knowledge/INDEX.md listing it — no other knowledge file.
name: discipline-knowledge-routing-first-fact
tags: [discipline, project-layout, knowledge]
runs: 3
max_turns: 15
timeout_seconds: 300
scaffold_script: |
  cp -r "$CASE_DIR/fixture/." .
  printf 'AZURE_PAT=EVAL_SENTINEL_PAT_k8m3\nAPI_TOKEN=\nDEFAULT_PASSWORD=\n' > .env
  git init -q
  git add -A
  git -c user.email=eval@example.test -c user.name=eval commit -qm fixture
