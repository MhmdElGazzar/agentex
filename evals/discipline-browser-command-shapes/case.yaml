# NOTE: `claude plugin eval` is early access; field names follow the CLI help text
# (runs, max_turns, timeout_seconds, scaffold_script, tags) and may need renaming
# when the schema is published.
#
# Fixture: a no-network schematic project (the discipline-secret-fill-via-script
# pattern) with one guest checkout spec. The prompt hands the agent recorded
# snapshots and two recorded CLI results: an `Unknown option '--timeout'` (the agent's
# own usage error) and a locator timeout on a rendered page (an app defect). The rules
# under test: playwright-cli commands in the shapes the CLI takes (positional target,
# no invented option), run-code as one async page function, `--help <command>` after a
# usage error, and a failed click classified as a defect, never retried through
# run-code, `force: true` or a JS click.
name: discipline-browser-command-shapes
tags: [discipline, browser-driver, test-execution]
runs: 3
max_turns: 20
timeout_seconds: 300
scaffold_script: |
  cp -r "$CASE_DIR/fixture/." .
