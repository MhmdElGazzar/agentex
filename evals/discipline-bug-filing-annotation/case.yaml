# NOTE: `claude plugin eval` is early access; field names follow the CLI help text
# (runs, max_turns, timeout_seconds, scaffold_script, tags) and may need renaming
# when the schema is published.
# The fixture has NO node_modules, so annotate-image.js cannot find @playwright/cli and
# exits 1 (playwright-cli-unavailable). Run the scaffold outside any folder whose
# node_modules holds @playwright/cli, or the script would find it by walking up.
name: discipline-bug-filing-annotation
tags: [discipline, bug-report-azure]
runs: 3
max_turns: 15
timeout_seconds: 300
scaffold_script: |
  cp -r "$CASE_DIR/fixture/." .
  rm -rf node_modules
  printf 'AZURE_PAT=EVAL_SENTINEL_PAT_a9c3\n' > .env
