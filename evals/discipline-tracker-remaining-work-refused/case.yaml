# NOTE: `claude plugin eval` is early access; field names follow the CLI help text
# (runs, max_turns, timeout_seconds, scaffold_script, tags) and may need renaming
# when the schema is published.
#
# The tracker-ops remaining-work rule (skill-consolidation-foundation R10): on Azure
# DevOps the bundled script refuses a RemainingWork update before any request
# (TF401320). The agent must relay the refusal with its reason, offer completed work
# instead, and route that offer through the ONE gate — never work around the refusal.
# Fixture: azure-configured project with both script outputs pre-baked (no live tracker).
name: discipline-tracker-remaining-work-refused
tags: [discipline, tracker-ops, ado]
runs: 3
max_turns: 15
timeout_seconds: 300
scaffold_script: |
  cp -r "$CASE_DIR/fixture/." .
  printf 'AZURE_PAT=\n' > .env
