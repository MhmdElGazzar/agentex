<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="app.title">API</title>
<style>
  /* System fonts only: the page loads nothing from outside the machine. */
  :root { --bg:#f6f7f9; --panel:#fff; --line:#dde1e7; --ink:#1d232b; --mute:#5d6875; --accent:#1f5fbf;
    --pass:#177245; --fail:#b42318; --warn:#9a6700; --skip:#6b7280; --ui:#5b3cc4; --proj:#0e7490; --auto:#4b5563; --ph:#b45309; --man:#374151; }
  * { box-sizing: border-box; }
  body { margin:0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif; color:var(--ink); background:var(--bg); }
  header.top { display:flex; align-items:center; gap:12px; padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line); }
  header.top h1 { font-size:16px; margin:0; flex:1; }
  button { font:inherit; padding:6px 12px; border-radius:6px; border:1px solid var(--line); background:#fff; cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  input, select, textarea { font:inherit; padding:5px 8px; border:1px solid var(--line); border-radius:6px; background:#fff; }
  input[type=checkbox], input[type=radio] { padding:0; }
  .muted { color:var(--mute); }
  .note { padding:8px 12px; border-radius:6px; background:#eef4ff; border:1px solid #c9dafc; margin:8px 0; }
  .warn { background:#fff6e5; border-color:#f3d28b; }
  .err { background:#fdecea; border-color:#f5b7b1; }
  .ok { background:#e8f6ee; border-color:#a6dcbc; }
  .badge { display:inline-block; font-size:11px; padding:1px 6px; border-radius:10px; color:#fff; margin-inline-start:4px; vertical-align:middle; }
  .b-ui { background:var(--ui); } .b-project { background:var(--proj); } .b-auto { background:var(--auto); }
  .b-placeholder { background:var(--ph); } .b-manual { background:var(--man); }
  .tag { display:inline-block; font-size:11px; padding:0 6px; border:1px solid var(--line); border-radius:4px; margin-inline-start:4px; color:var(--mute); }
  .r-PASS { color:var(--pass); font-weight:600; } .r-FAIL { color:var(--fail); font-weight:600; } .r-BLOCKED { color:var(--warn); } .r-SKIP { color:var(--skip); }
  table { border-collapse:collapse; width:100%; background:var(--panel); }
  th, td { text-align:start; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-weight:600; color:var(--mute); font-size:12px; }
  code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:12px; }
  [hidden] { display:none !important; }
  /* editor */
  #editor { display:grid; grid-template-columns: 260px 1fr; min-height: calc(100vh - 50px); }
  .rail { background:var(--panel); border-inline-end:1px solid var(--line); padding:12px; }
  .rail h2 { font-size:13px; margin:0 0 8px; color:var(--mute); }
  .suite { padding:8px; border-radius:6px; cursor:pointer; margin-bottom:4px; }
  .suite:hover { background:#f0f3f8; } .suite.on { background:#e6eefc; }
  .suite .nm { font-weight:600; } .suite .ct { font-size:12px; color:var(--mute); }
  .content { padding:12px 16px; overflow:auto; }
  .bar { display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-bottom:10px; }
  .bar .grow { flex:1; }
  .unsaved { color:var(--warn); font-weight:600; }
  .tabs button { border-radius:6px 6px 0 0; } .tabs button.on { background:#e6eefc; border-color:#b8cdf3; }
  .filters button.on { background:var(--ink); color:#fff; }
  .group td { background:#f0f3f8; font-weight:600; }
  .row { cursor:pointer; } .row:hover td { background:#fafbfd; }
  .drawer { position:fixed; inset-block:0; inset-inline-end:0; width:min(520px, 100vw); background:var(--panel); border-inline-start:1px solid var(--line); box-shadow:0 0 24px rgba(0,0,0,.12); padding:14px; overflow:auto; z-index:5; }
  .drawer h3 { font-size:13px; margin:14px 0 6px; color:var(--mute); }
  .prow { border:1px solid var(--line); border-radius:6px; padding:8px; margin-bottom:6px; }
  .prov { font-size:12px; color:var(--mute); }
  .dialog { position:fixed; inset:0; background:rgba(0,0,0,.25); display:flex; align-items:center; justify-content:center; z-index:10; }
  .dialog > div { background:#fff; padding:16px; border-radius:8px; max-width:520px; }
  pre.log { white-space:pre-wrap; max-height:220px; overflow:auto; background:#f6f7f9; padding:8px; border-radius:6px; }
  /* wizard */
  #wizard { max-width:1100px; margin:0 auto; padding:16px; }
  .steps { display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap; }
  .steps span { padding:4px 10px; border-radius:12px; background:#e9edf2; color:var(--mute); font-size:12px; }
  .steps span.on { background:var(--accent); color:#fff; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:14px; margin-bottom:12px; }
  .grid2 { display:grid; grid-template-columns: 220px 1fr; gap:8px 12px; align-items:center; }
  .actions { display:flex; gap:8px; justify-content:flex-end; margin-top:12px; }
</style>
</head>
<body>
<header class="top">
  <h1 id="title" data-i18n="app.title">API</h1>
  <button id="langBtn" data-i18n="app.lang">English</button>
  <button id="doneBtn" data-i18n="app.close">Close</button>
</header>
<div id="banner"></div>

<!-- ======================= Editor ======================= -->
<main id="editor" hidden>
  <aside class="rail">
    <h2 data-i18n="ed.rail">Services</h2>
    <div id="suiteList"></div>
    <p id="noSuites" class="muted" data-i18n="ed.noSuites" hidden></p>
    <button id="importBtn" data-i18n="ed.import">Import</button>
  </aside>
  <section class="content">
    <div class="bar">
      <label><span data-i18n="ed.env">Environment</span> <select id="envSel"></select></label>
      <span id="stats" class="muted grow"></span>
      <span id="unsaved" class="unsaved" data-i18n="ed.unsaved" hidden></span>
      <button id="saveBtn" data-i18n="ed.save">Save</button>
      <button id="runAllBtn" class="primary" data-i18n="ed.runAll">Run all</button>
    </div>
    <div id="edMsg"></div>
    <div class="bar tabs">
      <button id="tabCases" class="on" data-i18n="ed.tabCases">Cases</button>
      <button id="tabData" data-i18n="ed.tabData">Collected data</button>
      <span class="grow"></span>
      <span id="filePath" class="muted mono"></span>
    </div>
    <div id="casesView">
      <div class="bar filters" id="filters"></div>
      <table>
        <thead><tr><th data-i18n="ed.colCase">Case</th><th data-i18n="ed.colParams">Parameters</th><th data-i18n="ed.colStatus">Status</th><th data-i18n="ed.colCheck">Check</th><th data-i18n="ed.colLast">Last result</th></tr></thead>
        <tbody id="caseRows"></tbody>
      </table>
    </div>
    <div id="dataView" hidden>
      <div id="tokenEntry"></div>
      <table>
        <thead><tr><th data-i18n="cd.param">Parameter</th><th data-i18n="cd.value">Value</th><th data-i18n="cd.user">User</th><th data-i18n="cd.where">Collected at</th><th data-i18n="cd.used">Used by</th></tr></thead>
        <tbody id="dataRows"></tbody>
      </table>
      <p id="noData" class="muted" data-i18n="cd.none" hidden></p>
      <h3 data-i18n="cd.missing">Still missing</h3>
      <div id="missingList"></div>
    </div>
  </section>
  <aside id="drawer" class="drawer" hidden></aside>
</main>

<!-- ======================= Wizard ======================= -->
<main id="wizard" hidden>
  <h2 data-i18n="wiz.title">New suite</h2>
  <div class="steps" id="stepTabs"></div>

  <section id="step1" class="card">
    <p data-i18n="s1.lede"></p>
    <div class="grid2">
      <label for="specIn" data-i18n="s1.source">Spec</label><input id="specIn" class="mono">
      <label for="nameIn" data-i18n="s1.name">Name</label><input id="nameIn">
      <label for="envIn" data-i18n="s1.env">Environment</label><select id="envIn"></select>
    </div>
    <p id="noEnvs" class="note warn" data-i18n="s1.noEnvs" hidden></p>
    <div id="s1Msg"></div>
    <div class="actions"><button id="s1Next" class="primary" data-i18n="nav.next">Next</button></div>
  </section>

  <section id="step2" class="card" hidden>
    <table>
      <thead><tr><th data-i18n="s2.select">Test</th><th data-i18n="s2.method">Method</th><th data-i18n="s2.path">Path</th><th data-i18n="s2.summary">Summary</th><th data-i18n="s2.auth">Auth</th><th data-i18n="s2.needs">Needs</th><th data-i18n="s2.note">Note</th></tr></thead>
      <tbody id="opRows"></tbody>
    </table>
    <p id="pickOne" class="note warn" data-i18n="s2.pickOne" hidden></p>
    <div class="actions"><button id="s2Back" data-i18n="nav.back">Back</button><button id="s2Next" class="primary" data-i18n="nav.next">Next</button></div>
  </section>

  <section id="step3" class="card" hidden>
    <div id="whoLine" class="note"></div>
    <div class="bar">
      <label><span data-i18n="s3.user">User</span> <select id="userSel"></select></label>
      <button id="collectBtn" class="primary" data-i18n="s3.collect">Collect</button>
      <button id="againMissing" data-i18n="s3.againMissing" hidden>Again</button>
      <button id="againAll" data-i18n="s3.againAll" hidden>Again all</button>
      <button id="cancelBtn" data-i18n="s3.cancel" hidden>Stop</button>
      <span id="progress" class="muted"></span>
    </div>
    <div id="noAgent" class="note warn" data-i18n="s3.noAgent" hidden></div>
    <div id="s3Notes"></div>
    <div id="gateBox" class="note warn" hidden><span id="gateText"></span> <button id="gateDone" data-i18n="s3.gateDone">Done</button></div>
    <div id="proposalBox" class="card" hidden></div>
    <table>
      <thead><tr><th data-i18n="cd.param">Parameter</th><th data-i18n="s3.param">Value</th><th data-i18n="s3.source">Source</th><th data-i18n="s3.where">Where</th></tr></thead>
      <tbody id="needRows"></tbody>
    </table>
    <div class="actions"><button id="s3Back" data-i18n="nav.back">Back</button><button id="s3Next" class="primary" data-i18n="nav.next">Next</button></div>
  </section>

  <section id="step4" class="card" hidden>
    <p id="totals"></p>
    <h3 data-i18n="s4.byKind">By kind</h3>
    <div id="kinds" class="bar"></div>
    <div id="previewList"></div>
    <div class="actions"><button id="s4Back" data-i18n="nav.back">Back</button><button id="s4Next" class="primary" data-i18n="nav.next">Next</button></div>
  </section>

  <section id="step5" class="card" hidden>
    <p data-i18n="s5.files"></p>
    <ul id="fileList" class="mono"></ul>
    <h3 data-i18n="s5.sources">Sources</h3>
    <div id="sourceCounts" class="bar"></div>
    <div class="grid2"><label for="baseUrlIn" id="baseUrlLabel"></label><input id="baseUrlIn" class="mono"></div>
    <p id="envLine" class="muted"></p>
    <p id="tokLine" class="muted"></p>
    <div id="s5Msg"></div>
    <div class="actions"><button id="s5Back" data-i18n="nav.back">Back</button><button id="s5Open" class="primary" data-i18n="s5.open">Approve</button><button id="s5Run" data-i18n="s5.run">Approve and run</button></div>
  </section>
</main>

<script>
'use strict';
// Injected by server.js per run: the page token, the language, the view and an optional suite.
const STUDIO = { token: '__STUDIO_TOKEN__', lang: '__STUDIO_LANG__', view: '__STUDIO_VIEW__', suite: '__STUDIO_SUITE__', spec: '__STUDIO_SPEC__' };
let STR = { en: {}, ar: {} };
let LANG = STUDIO.lang === 'en' ? 'en' : 'ar';
const $ = id => document.getElementById(id);
const t = (k, v) => String((STR[LANG] && STR[LANG][k]) || k).replace(/\{(\w+)\}/g, (_, n) => (v && v[n] !== undefined ? String(v[n]) : `{${n}}`));
function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === undefined || v === null || v === false) continue;
    if (k === 'class') n.className = v; else if (k === 'text') n.textContent = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c !== null && c !== undefined && c !== false) n.append(c.nodeType ? c : document.createTextNode(String(c)));
  return n;
}
async function api(method, p, body) {
  let r;
  try {
    r = await fetch(p, { method, headers: { 'x-studio-token': STUDIO.token, 'content-type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  } catch (e) { return { status: 0, ok: false, error: 'offline', message: e.message }; }
  let j = {};
  try { j = await r.json(); } catch { j = {}; }
  return { httpStatus: r.status, ...j };
}
function note(target, cls, text) { const box = typeof target === 'string' ? $(target) : target; box.replaceChildren(text ? el('div', { class: `note ${cls}`, text }) : ''); }
function applyI18n() {
  document.documentElement.lang = LANG;
  document.documentElement.dir = LANG === 'ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-i18n]').forEach(n => { n.textContent = t(n.dataset.i18n); });
}
const fmt = v => (v !== null && typeof v === 'object' ? JSON.stringify(v) : String(v));
const badge = src => el('span', { class: `badge b-${src || 'manual'}`, text: t(`badge.${src || 'manual'}`) });
const MESSAGE_PATHS = ['message', 'error.message', 'detail', 'title', 'error'];

// ============================ Editor ============================
const ED = { suites: [], envs: [], env: '', path: null, doc: null, etag: null, canonical: true, endpoints: {}, last: {}, collected: {}, edits: [], filter: 'all', tab: 'cases', drawer: null, run: null, conflictEdits: null };

function clone(o) { return JSON.parse(JSON.stringify(o)); }
// The same edit model as suite_store.applyEdits, applied locally to show unsaved edits.
function applyUpdate(c, u) {
  if (typeof u.name === 'string' && u.name.trim()) c.name = u.name.trim();
  if ('auth' in u) { if (u.auth === 'none') c.auth = 'none'; else delete c.auth; }
  if (u.params) { c.params = c.params || {}; Object.assign(c.params, u.params); }
  if (u.sources) { c.sources = c.sources || {}; for (const [k, v] of Object.entries(u.sources)) { if (v == null) delete c.sources[k]; else c.sources[k] = v; } if (!Object.keys(c.sources).length) delete c.sources; }
  if ('omit' in u) { if (u.omit && u.omit.length) c.omit = u.omit.slice(); else delete c.omit; }
  if (u.expect) {
    const e = c.expect = c.expect || {};
    if ('status' in u.expect) { if (u.expect.status === null || u.expect.status === '') delete e.status; else e.status = Number(u.expect.status); }
    if ('fields' in u.expect) { if (u.expect.fields && u.expect.fields.length) e.fields = u.expect.fields.slice(); else delete e.fields; }
    if ('message' in u.expect) {
      const m = u.expect.message || {}; const from = m.from !== undefined ? m.from : m.path;
      for (const map of ['equals', 'contains']) if (e[map] && from) delete e[map][from];
      if (m.path && m.text) { const map = m.match === 'contains' ? 'contains' : 'equals'; e[map] = e[map] || {}; e[map][m.path] = m.text; }
      for (const map of ['equals', 'contains']) if (e[map] && !Object.keys(e[map]).length) delete e[map];
    }
  }
  if ('skip' in u) { if (u.skip) c.skip = String(u.skip); else delete c.skip; }
}
function viewCases() {
  const doc = clone(ED.doc || { cases: [] });
  const cases = (doc.cases || []).map((c, i) => Object.assign(c, { __i: i + 1 }));
  const orig = cases.slice(); const deleted = new Set();
  ED.edits.forEach((e, k) => {
    if (e.op === 'update') applyUpdate(orig[e.index - 1], e.case);
    else if (e.op === 'delete') deleted.add(orig[e.index - 1]);
    else if (e.op === 'add') {
      const c = Object.assign(clone(e.case), { __add: k });
      let at = -1; cases.forEach((x, i) => { if (x.entry === c.entry) at = i; });
      if (at === -1) cases.push(c); else cases.splice(at + 1, 0, c);
    }
  });
  return cases.filter(c => !deleted.has(c));
}
const needsReview = __STUDIO_NEEDS_REVIEW__; // shared with the wizard and suite_store: swagger_model.js needsReview (N10)
const lastOf = c => (c.__i && ED.last[c.__i] && ED.last[c.__i].name === (ED.doc.cases[c.__i - 1] || {}).name ? ED.last[c.__i] : null);
function matches(c, f) {
  if (f === 'needs-review') return needsReview(c);
  if (f === 'failing') { const l = lastOf(c); return !!l && l.result === 'FAIL'; }
  if (f === 'skipped') return !!c.skip;
  return true;
}
function messageCheck(c) {
  const e = c.expect || {};
  const cont = Object.keys(e.contains || {});
  if (cont.length) return { path: cont[0], text: e.contains[cont[0]], match: 'contains', others: Object.keys(e.equals || {}).length + cont.length - 1 };
  const eq = Object.keys(e.equals || {});
  const p = eq.find(k => MESSAGE_PATHS.includes(k)) || eq[0];
  if (p) return { path: p, text: e.equals[p], match: 'equals', others: eq.length - 1 };
  return { path: '', text: '', match: 'equals', others: 0 };
}
function rcText(r) {
  const reason = r.reason || '';
  const env = (/on "([^"]+)"/.exec(reason) || [])[1] || ED.env;
  if (r.reasonCode === 'placeholder') return t('rc.placeholder', { p: (/param "([^"]+)"/.exec(reason) || [])[1] || '' });
  if (r.reasonCode === 'token-missing') return t('rc.token-missing', { env, NAME: (/set (\S+) in \.env/.exec(reason) || [])[1] || '' });
  if (r.reasonCode === 'token-expired') return t('rc.token-expired', { env, time: (/expired at (\S+)/.exec(reason) || [])[1] || '' });
  return reason;
}
function resultCell(c) {
  if (ED.run && ED.run.status === 'running' && (ED.run.case === undefined ? !c.skip : ED.run.case === c.__i)) return el('span', { class: 'muted', text: t('res.running') });
  const l = lastOf(c);
  if (!l) return el('span', { class: 'muted', text: t('res.notRun') });
  if (l.result === 'PASS') return el('span', { class: 'r-PASS', text: `${t('res.pass')} ${l.status}${l.ms !== undefined ? ` · ${l.ms} ms` : ''}` });
  if (l.result === 'FAIL') return el('span', { class: 'r-FAIL', text: `${t('res.fail')} ${l.status !== undefined ? l.status : ''} · ${(l.failures || [l.reason || '']).join('; ')}` });
  if (l.skipped) return el('span', { class: 'r-SKIP', text: t('res.skipped') });
  return el('span', { class: 'r-BLOCKED', text: `${t('res.blocked')} — ${rcText(l)}` });
}
function renderRail() {
  $('suiteList').replaceChildren(...ED.suites.map(s => el('div', { class: `suite${s.path === ED.path ? ' on' : ''}`, onclick: () => openSuite(s.path) },
    el('div', { class: 'nm', text: s.name }),
    el('div', { class: 'ct', text: s.error ? s.error : t('ed.counts', { e: s.endpoints, c: s.cases }) }),
    s.needsReview ? el('span', { class: 'tag', text: `${t('filter.needs-review')} ${s.needsReview}` }) : null,
    s.failing ? el('span', { class: 'tag r-FAIL', text: `${t('filter.failing')} ${s.failing}` }) : null)));
  $('noSuites').hidden = ED.suites.length > 0;
}
function renderEnvSel() {
  $('envSel').replaceChildren(...ED.envs.map(e => el('option', { value: e.name, text: e.name, selected: e.name === ED.env })));
}
function renderEditor() {
  const cases = viewCases();
  $('unsaved').hidden = ED.edits.length === 0;
  $('filePath').textContent = ED.path ? t('ed.file', { path: ED.path }) : '';
  const count = f => cases.filter(c => matches(c, f)).length;
  const lasts = cases.map(lastOf).filter(Boolean);
  $('stats').textContent = ED.path ? t('ed.stat', { cases: cases.length, review: count('needs-review'), pass: lasts.filter(l => l.result === 'PASS').length, fail: lasts.filter(l => l.result === 'FAIL').length, skipped: count('skipped') }) : '';
  $('filters').replaceChildren(...['all', 'needs-review', 'failing', 'skipped'].map(f => el('button', { class: ED.filter === f ? 'on' : '', onclick: () => { ED.filter = f; renderEditor(); }, text: `${t(`filter.${f}`)} (${count(f)})` })));
  $('casesView').hidden = ED.tab !== 'cases'; $('dataView').hidden = ED.tab !== 'data';
  $('tabCases').className = ED.tab === 'cases' ? 'on' : ''; $('tabData').className = ED.tab === 'data' ? 'on' : '';
  const rows = [];
  const groups = [];
  for (const c of cases) { let g = groups.find(x => x.entry === c.entry); if (!g) groups.push(g = { entry: c.entry, cases: [] }); g.cases.push(c); }
  for (const g of groups) {
    const ep = ED.endpoints[g.entry] || { method: '', path: g.entry };
    const shown = g.cases.filter(c => matches(c, ED.filter));
    if (!shown.length) continue;
    rows.push(el('tr', { class: 'group' }, el('td', { colspan: 5 },
      el('span', { class: 'mono', text: `${ep.method} ${ep.path}` }), ' ', el('span', { class: 'muted', text: t('ed.cases', { n: g.cases.length }) }), ' ',
      el('button', { onclick: ev => { ev.stopPropagation(); addCase(g.entry); }, text: t('ed.addCase') }))));
    for (const c of shown) {
      const mc = messageCheck(c);
      const params = Object.entries(c.params || {}).map(([k, v]) => el('div', {},
        el('span', { class: 'mono', text: `${k} = ${(c.omit || []).includes(k) ? t('ed.omitted') : fmt(v)}` }),
        badge((c.sources || {})[k] || 'manual')));

    const input = el('input', { class: 'mono', value: draft !== undefined ? draft : (v && v.source === 'manual' ? fmt(v.value) : ''), oninput: ev => { WZ.drafts[n.param] = ev.target.value; } });
    const prov = v && v.provenance ? [v.provenance.screen, v.provenance.call, v.provenance.file, v.provenance.path].filter(Boolean).join(' · ') : '';
    return el('tr', {},
      el('td', { class: 'mono', text: `${n.param} (${n.in})` }),
      el('td', {}, v && ['ui', 'project'].includes(v.source) ? el('span', { class: 'mono', text: fmt(v.value) }) :
        el('span', {}, input, ' ', el('button', { onclick: () => setValue(n.param, input.value, 'manual'), text: t('s3.set') }), ' ',
          el('button', { onclick: () => setValue(n.param, '', 'placeholder'), text: t('s3.leave') }))),
      el('td', {}, src ? badge(src) : el('span', { class: 'muted', text: (s.missing || {})[n.param] ? t('s3.notFound') : '—' })),
      el('td', { class: 'prov', text: prov || (((s.missing || {})[n.param] || {}).hint || '') + (v && v.user ? ` ${v.user}` : '') }));
  }));
}
async function setValue(param, value, source) {
  if (source === 'manual' && !String(value).trim()) return;
  await api('POST', '/api/wizard/value', { param, value, source });
  delete WZ.drafts[param];
  await refreshState();
}
async function consent(decision) { await api('POST', '/api/wizard/consent', { proposalId: WZ.state.run.proposal.id, decision }); await refreshState(); }
async function refreshState() { const r = await api('GET', '/api/wizard/state'); if (r.ok) { WZ.state = r; if (WZ.step === 3) renderStep3(); } }
async function pollState() {
  if (WZ.polling) return; WZ.polling = true;
  while (WZ.step === 3) { await refreshState(); await new Promise(r => setTimeout(r, 1000)); }
  WZ.polling = false;
}
$('userSel').addEventListener('change', renderStep3);
$('collectBtn').addEventListener('click', async () => { const r = await api('POST', '/api/wizard/collect', { user: $('userSel').value || null }); if (!r.ok && r.error === 'no-agent') $('noAgent').hidden = false; refreshState(); });
$('againMissing').addEventListener('click', async () => { await api('POST', '/api/wizard/collect-again', { all: false, user: $('userSel').value || null }); refreshState(); });
$('againAll').addEventListener('click', async () => { await api('POST', '/api/wizard/collect-again', { all: true, user: $('userSel').value || null }); refreshState(); });
$('cancelBtn').addEventListener('click', async () => { await api('POST', '/api/wizard/cancel', {}); refreshState(); });
$('gateDone').addEventListener('click', async () => { await api('POST', '/api/wizard/gate-cleared', {}); refreshState(); });
$('s3Back').addEventListener('click', () => showStep(2));
$('s3Next').addEventListener('click', () => showStep(4));
async function loadPreview() {
  const r = await api('GET', '/api/wizard/preview');
  if (!r.ok) { $('previewList').replaceChildren(el('div', { class: 'note err', text: t('app.error', { msg: r.message || r.error }) })); return; }
  WZ.preview = r;
  const s = r.summary;
  $('totals').textContent = t('s4.totals', { total: s.total, ready: s.ready, review: s.review, skipped: s.skipped });
  $('kinds').replaceChildren(...Object.entries(s.byKind).map(([k, n]) => el('span', { class: 'tag', text: `${t(`kind.${k}`)}: ${n}` })));
  $('previewList').replaceChildren(...s.endpoints.map(e => el('div', { class: 'card' },
    el('strong', { class: 'mono', text: `${e.method} ${e.path}` }),
    el('table', {}, el('tbody', {}, e.cases.map(c => el('tr', {},
      el('td', { text: c.name }), el('td', { text: t(`kind.${c.kind}`) }), el('td', { class: 'mono', text: `${t('s4.expect')} ${c.status}` }),
      el('td', {}, c.skipped ? el('span', { class: 'tag', text: t('s4.skip') }) : null, c.needsReview ? el('span', { class: 'tag', text: t('s4.review') }) : null))))))));
}
$('s4Back').addEventListener('click', () => showStep(3));
$('s4Next').addEventListener('click', () => showStep(5));
function renderStep5() {
  const p = WZ.preview;
  if (!p) return;
  $('fileList').replaceChildren(el('li', { text: p.files.catalog }), el('li', { text: p.files.suite }));
  $('sourceCounts').replaceChildren(...['ui', 'project', 'auto', 'placeholder', 'manual'].map(k => el('span', {}, badge(k), ` ${p.summary.bySource[k] || 0}`)));
  $('baseUrlLabel').textContent = t('s5.baseUrl', { NAME: p.baseUrl.var });
  $('baseUrlIn').value = p.baseUrl.suggested || '';
  $('baseUrlIn').disabled = p.baseUrl.isSet;
  $('envLine').textContent = p.baseUrl.isSet ? t('s5.baseUrlSet', { NAME: p.baseUrl.var }) : t('s5.envLine', { NAME: p.baseUrl.var });
  $('tokLine').textContent = p.token && p.token.present ? t('tok.entry', { user: p.token.user || '—', time: p.token.capturedAt || '—' }) : '';
  const exists = p.exists && (p.exists.catalog || p.exists.suite);
  if (exists) note('s5Msg', 'err', t('s5.exists', { file: p.exists.catalog ? p.files.catalog : p.files.suite })); else note('s5Msg', '', '');
  $('s5Open').disabled = $('s5Run').disabled = !!exists;
}
async function approve(runNow) {
  $('s5Open').disabled = $('s5Run').disabled = true;
  note('s5Msg', '', t('s5.approving'));
  const r = await api('POST', '/api/wizard/approve', { baseUrl: $('baseUrlIn').value.trim(), run: runNow });
  if (!r.ok) {
    if (r.error === 'exists') note('s5Msg', 'err', t('s5.exists', { file: r.file }));
    else note('s5Msg', 'err', t('app.error', { msg: r.message || r.error }));
    return;
  }
  const notIgnored = (r.notIgnored || []).map(p => t('ed.notIgnored', { path: p })).join(' ');
  if (notIgnored) sessionStorage.setItem('studioNotice', notIgnored);
  location.href = `/editor?lang=${LANG}&suite=${encodeURIComponent(r.suitePath)}&filter=${r.filter}${r.runId ? `&run=${r.runId}` : ''}`;
}
$('s5Back').addEventListener('click', () => showStep(4));
$('s5Open').addEventListener('click', () => approve(false));
$('s5Run').addEventListener('click', () => approve(true));

// ============================ Boot ============================
$('langBtn').addEventListener('click', () => { LANG = LANG === 'ar' ? 'en' : 'ar'; applyI18n(); if (!$('editor').hidden) { renderRail(); renderEditor(); } else showStep(WZ.step); });
$('doneBtn').addEventListener('click', async () => { await api('GET', '/api/done'); document.body.replaceChildren(el('p', { class: 'note', text: t('app.closed') })); });
(async () => {
  const s = await api('GET', '/api/strings');
  if (s.en) STR = s;
  applyI18n();
  const params = new URLSearchParams(location.search);
  const notice = sessionStorage.getItem('studioNotice');
  if (notice) { sessionStorage.removeItem('studioNotice'); note('banner', 'warn', notice); }
  if (STUDIO.view === 'wizard') await startWizard();
  else {
    await startEditor(params);
    const runId = params.get('run');
    if (runId) {
      ED.run = { id: runId, status: 'running' }; renderEditor();
      const poll = async () => { const r = await api('GET', `/api/run/${runId}`); if (r.status === 'done' || !r.ok) { ED.run = null; if (ED.path) openSuite(ED.path, true); return; } setTimeout(poll, 1000); };
      poll();
    }
  }
})();
</script>
</body>
</html>
