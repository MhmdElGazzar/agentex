/* ── Steps Track ────────────────────────────────────────────────────────── */
function buildTrack() {
  const track = document.getElementById('steps-track');
  track.innerHTML = '';
  let prevGroup = null;
  schema.steps.forEach((step, i) => {
    const group = step.group || null;
    if (group !== prevGroup && group && schema.groups && schema.groups[group]) {
      // Group boundary: a label instead of a connector — the track reads
      // "المشروع: … | البيئات: …", mirroring the two config homes.
      const label = document.createElement('div');
      label.className = 'sgroup-label';
      label.textContent = schema.groups[group].label;
      track.appendChild(label);
    } else if (i > 0) {
      const conn = document.createElement('div');
      conn.className = `snode-connector${i <= current ? ' done' : ''}`;
      track.appendChild(conn);
    }
    const node = document.createElement('div');
    node.className = `snode${i === current ? ' active' : ''}${i < current ? ' done' : ''}`;
    node.innerHTML = `
      <div class="sbubble">${i < current ? '✓' : step.icon || (i+1)}</div>
      <div class="slabel">${step.title}</div>`;
    node.onclick = () => { if (i <= current) goTo(i); };
    track.appendChild(node);
    prevGroup = group;
  });
}

function updateProgress() {
  const total = schema ? schema.steps.length : 1;
  const pct   = current < 0 ? 0 : Math.round(((current + 1) / total) * 100);
  document.getElementById('prog-fill').style.width = pct + '%';
  const pill = document.getElementById('hdr-pill');
  if (current >= 0) {
    pill.textContent = `الخطوة ${current + 1} من ${total}`;
    pill.classList.add('show');
  } else {
    pill.classList.remove('show');
  }
}

/* ── Render Step ────────────────────────────────────────────────────────── */
function renderStep() {
  updateProgress();
  buildTrack();
  document.getElementById('steps-scroll').classList.add('show');

  const step = schema.steps[current];
  const card = document.getElementById('card');
  card.innerHTML = '';

  // Head
  const head = document.createElement('div');
  head.className = 'card-head';
  head.innerHTML = `
    <div class="head-icon">${step.icon || '📝'}</div>
    <div>
      <div class="head-title">
        ${step.title}
        ${step.optional ? '<span class="optional-pill">⚡ اختياري</span>' : ''}
      </div>
      <div class="head-desc">${step.description}</div>
      ${step.target ? `<div class="target-chip" id="target-chip">${esc(resolveTarget(step.target))}</div>` : ''}
    </div>`;
  card.appendChild(head);

  // Body
  const body = document.createElement('div');
  body.className = 'card-body';
  if (step.type === 'review') body.appendChild(renderReviewStep());
  else if (step.type === 'dynamic-list') body.appendChild(renderUsersStep(step));
  else if (step.type === 'env-manager') body.appendChild(renderEnvManagerStep());
  else {
    renderFields(step, body);
    if (step.defaultsSection) body.appendChild(renderDefaultsSection());
  }
  card.appendChild(body);

  // Footer
  card.appendChild(renderFooter(step));
}

/* ── Fields ─────────────────────────────────────────────────────────────── */
/** The one config file this page writes — {envName} resolves to the ACTIVE environment. */
function resolveTarget(target) {
  return target.replace('{envName}', String(answers['envName'] || '').trim() || 'qc');   // 'qc' mirrors engine.js DEFAULT_ENV_NAME
}

function renderFields(step, container) {
  if (!step.fields) return;

  // Group: regular fields, then secrets at the bottom
  const regular = step.fields.filter(f => !f.secret);
  const secretFs = step.fields.filter(f => f.secret);

  const needsGrid = regular.length >= 4;
  const wrap = needsGrid
    ? Object.assign(document.createElement('div'), { className: 'field-grid-2' })
    : container;
  if (needsGrid) container.appendChild(wrap);

  regular.forEach(f => wrap.appendChild(buildField(f)));

  if (secretFs.length > 0) {
    const div = document.createElement('div');
    div.className = 'section-divider';
    div.textContent = 'بيانات سرية';
    container.appendChild(div);
    secretFs.forEach(f => container.appendChild(buildField(f)));
  }
}

// db/api env-var NAME fields: on a 2nd+ environment they prefill a suffixed
// suggestion (API_TOKEN_UAT) so two environments do not silently share one
// .env secret slot — a visible, editable prefill, never silent behavior (B5).
const SUFFIXED_ENV_VAR_KEYS = ['db.passwordEnvVar', 'api.tokenEnvVar'];
const envVarSuffix = (name) => String(name || '').toUpperCase().replace(/[^A-Z0-9_]/g, '_');

function buildField(field) {
  const div = document.createElement('div');
  div.className = 'field';

  // The environment name is managed by the environments page: shown here as a
  // read-only label whose ONE affordance routes through the rename confirm
  // dialog — typing can no longer silently fork a fresh environment.
  if (field.readonly && field.key === 'envName') {
    answers['envName'] = activeEnv;
    div.innerHTML = `
      <label class="field-label">${field.label}</label>
      ${field.hint ? `<div class="field-hint">${field.hint}</div>` : ''}
      <div style="display:flex;gap:8px;align-items:center">
        <input type="text" value="${esc(activeEnv || '')}" readonly
          style="background:var(--bg-muted);cursor:default;direction:ltr" />
        <button type="button" class="btn-sm" style="white-space:nowrap">🏷️ إعادة تسمية</button>
      </div>`;
    div.querySelector('button').onclick = () => openRenameDialog(activeEnv);
    return div;
  }

  // Environment-scoped secrets (db/api) live per environment — two
  // environments may each carry a DB password without clobbering each other.
  const isEnvSecret = field.secret && ENV_SECRET_KEYS.has(field.key);
  const secretStore = isEnvSecret ? envs[activeEnv].secrets : secrets;

  let savedVal = field.secret
    ? (secretStore[field.key] || '')
    : (answers[field.key] !== undefined ? answers[field.key] : (field.default ?? ''));
  if (!field.secret && answers[field.key] === undefined && field.default &&
      SUFFIXED_ENV_VAR_KEYS.includes(field.key) && envOrder.indexOf(activeEnv) > 0) {
    savedVal = `${field.default}_${envVarSuffix(activeEnv)}`;
  }

  div.innerHTML = `
    <label class="field-label">
      ${field.label}
      ${field.required ? '<span class="req">*</span>' : ''}
    </label>
    ${field.hint ? `<div class="field-hint">${field.hint}</div>` : ''}
    ${buildInput(field, savedVal)}
    ${field.secret ? `<div class="field-secret-note">محفوظ بشكل آمن</div>` : ''}`;

  const inp = div.querySelector('input,select,textarea');
  if (inp) {
    if (field.secret) {
      inp.classList.add('secret-input');
      inp.addEventListener('input', () => { secretStore[field.key] = inp.value; });
    } else {
      // Seed the answer with the rendered value (defaults included) so an
      // untouched field with a default — e.g. a preselected <select> — is
      // "filled" for validation, not just visually.
      if (answers[field.key] === undefined && inp.value !== '') answers[field.key] = inp.value;
      inp.addEventListener('change', () => { answers[field.key] = inp.value; });
      inp.addEventListener('input',  () => {
        answers[field.key] = inp.value;
        if (envScopedKeys().includes(field.key)) markActiveEnvDirty();
      });
    }
  }
  return div;
}

function buildInput(field, val) {
  if (field.type === 'select') {
    const opts = field.options.map(o =>
      `<option value="${o.value}"${val===o.value?' selected':''}>${o.label}</option>`).join('');
    return `<select>${opts}</select>`;
  }
  const t = { password:'password', email:'email', number:'number', url:'url' }[field.type] || 'text';
  return `<input type="${t}" value="${esc(val)}" placeholder="${esc(field.placeholder||'')}" />`;
}

function esc(s) { return String(s||'').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

/* ── Defaults section (E1) — schema-driven from defaultsFields ────────────── */
/** The environment page's defaults block: one input per descriptor (VALUES are
 *  per-environment; the field set is shared), plus the field-set editor. */
function renderDefaultsSection() {
  const wrap = document.createElement('div');
  wrap.style.cssText = 'display:flex;flex-direction:column;gap:18px';
  const div = document.createElement('div');
  div.className = 'section-divider';
  div.textContent = 'القيم الافتراضية';
  wrap.appendChild(div);
  for (const f of defaultsFieldsSession) {
    if (f.secret) { wrap.appendChild(buildDefaultsSecretField(f)); continue; }
    wrap.appendChild(buildField({
      key: `defaults.${f.key}`, label: f.label || f.key, type: f.type || 'text',
      placeholder: f.placeholder !== undefined ? f.placeholder : (f.default || ''),
      default: f.default, hint: f.hint, required: !!f.required,
    }));
  }
  const editBtn = document.createElement('button');
  editBtn.className = 'btn-add';
  editBtn.innerHTML = '⚙️ تعديل الحقول';
  editBtn.onclick = () => openFieldEditor('defaults');
  wrap.appendChild(editBtn);
  const hint = document.createElement('div');
  hint.className = 'field-hint';
  hint.textContent = 'الحقول دي معرّفة مرة واحدة ومشتركة بين كل البيئات — القيم بس هي اللي بتختلف من بيئة لبيئة.';
  wrap.appendChild(hint);
  return wrap;
}

/** A secret defaults field: env-var NAME input + value input. The name lands
 *  in the file as { envSecret }; the value goes to .env only (invariant #5). */
function buildDefaultsSecretField(f) {
  const div = document.createElement('div');
  div.className = 'field';
  const nameKey = `defaults.${f.key}EnvVar`;
  const suggestion = suggestDefaultsSecretName(f.key);
  const nameVal = answers[nameKey] !== undefined ? answers[nameKey] : '';
  const secVal = (envs[activeEnv] && envs[activeEnv].secrets[`defaults.${f.key}`]) || '';
  div.innerHTML = `
    <label class="field-label">${esc(f.label || f.key)} 🔒${f.required ? ' <span class="req">*</span>' : ''}</label>
    ${f.hint ? `<div class="field-hint">${f.hint}</div>` : ''}
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <input type="text" class="df-name" value="${esc(nameVal)}" placeholder="${esc(suggestion)}"
        style="direction:ltr;font-family:var(--mono);flex:1;min-width:150px" />
      <input type="password" class="df-val secret-input" value="${esc(secVal)}" placeholder="••••••••"
        style="flex:1;min-width:150px" />
    </div>
    <div class="field-secret-note">القيمة بتتكتب في ‎.env تحت الاسم ده — عمرها ما بتتكتب في ملف البيئة</div>`;
  const nameInp = div.querySelector('.df-name');
  const valInp = div.querySelector('.df-val');
  nameInp.addEventListener('input', () => { answers[nameKey] = nameInp.value; markActiveEnvDirty(); });
  valInp.addEventListener('input', () => {
    envs[activeEnv].secrets[`defaults.${f.key}`] = valInp.value;
    markActiveEnvDirty();
    // Visible, editable prefill: typing a value fills an empty name with the
    // convention suggestion — never silent behavior.
    if (valInp.value && !String(nameInp.value || '').trim()) {
      nameInp.value = suggestion;
      answers[nameKey] = suggestion;
    }
  });
  return div;
}

/* ── Users Step ─────────────────────────────────────────────────────────── */
function renderUsersStep(_step) {
  answers['users'] = users;
  const outer = document.createElement('div');
  outer.style.cssText = 'display:flex;flex-direction:column;gap:14px';

  const list = document.createElement('div');
  list.className = 'user-list'; list.id = 'user-list';
  refreshUserCards(list);

  const row = document.createElement('div');
  row.style.cssText = 'display:flex;gap:10px;flex-wrap:wrap';
  const addBtn = document.createElement('button');
  addBtn.className = 'btn-add';
  addBtn.innerHTML = '+ إضافة مستخدم';
  addBtn.onclick = () => {
    users.push({ handle: '' });
    usersDirty();
    refreshUserCards(document.getElementById('user-list'));
  };
  const editBtn = document.createElement('button');
  editBtn.className = 'btn-add';
  editBtn.innerHTML = '⚙️ تعديل الحقول';
  editBtn.onclick = () => openFieldEditor('user');
  row.appendChild(addBtn);
  row.appendChild(editBtn);

  const hint = document.createElement('div');
  hint.className = 'field-hint';
  hint.textContent = 'مجموعة الحقول معرّفة مرة واحدة ومشتركة بين كل البيئات — أي تعديل فيها بيظهر لكل مستخدم في كل بيئة؛ القيم نفسها لكل بيئة على حدة.';

  outer.appendChild(list);
  outer.appendChild(row);
  outer.appendChild(hint);
  return outer;
}

/** One card per user — the handle is fixed (it keys the users object); every
 *  other input comes from the shared userFields schema. */
function refreshUserCards(list) {
  list.innerHTML = '';
  users.forEach((u, i) => {
    const card = document.createElement('div');
    card.className = 'user-card';
    const cells = [`
        <div class="field">
          <label class="field-label">المعرّف <span class="req">*</span></label>
          <input type="text" placeholder="valid_user" value="${esc(u.handle)}"
            oninput="users[${i}].handle=this.value;usersDirty()" />
        </div>`];
    for (const f of userFieldsSession) {
      if (f.secret) {
        cells.push(`
        <div class="field" style="grid-column:1/-1">
          <label class="field-label">${esc(f.label || f.key)} 🔒${f.required ? ' <span class="req">*</span>' : ''}</label>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <input type="text" id="usf-${i}-${f.key}" value="${esc(u[f.key] || '')}"
              placeholder="${esc(suggestUserSecretName(u.handle, f.key))}"
              style="direction:ltr;font-family:var(--mono);flex:1;min-width:140px"
              oninput="users[${i}]['${f.key}']=this.value;usersDirty()" />
            <input type="password" class="secret-input" value="${esc((u._secrets && u._secrets[f.key]) || '')}"
              placeholder="••••••••" style="flex:1;min-width:140px"
              oninput="userSecretInput(${i},'${f.key}',this)" />
          </div>
          <div class="field-secret-note">القيمة بتتكتب في ‎.env تحت الاسم ده — ملف البيئة بيشاور عليها بـ envSecret بس</div>
        </div>`);
      } else {
        const t = { email: 'email', number: 'number', url: 'url' }[f.type] || 'text';
        cells.push(`
        <div class="field">
          <label class="field-label">${esc(f.label || f.key)}${f.required ? ' <span class="req">*</span>' : ''}</label>
          <input type="${t}" placeholder="${esc(f.placeholder || '')}" value="${esc(u[f.key] || '')}"
            oninput="users[${i}]['${f.key}']=this.value;usersDirty()" />
        </div>`);
      }
    }
    card.innerHTML = `
      <div class="user-card-head">
        <div class="user-card-label">👤 مستخدم ${i+1}</div>
        ${users.length > 1
          ? `<button class="btn-rm" onclick="removeUser(${i})">✕</button>` : ''}
      </div>
      <div class="field-grid-2">${cells.join('')}</div>`;
    list.appendChild(card);
  });
}

/** A typed secret VALUE lives in the session only (never in JSON); typing it
 *  fills an empty name slot with the USER_<HANDLE>_<KEY> prefill — visible
 *  and editable, never silent. */
function userSecretInput(i, key, inp) {
  const u = users[i];
  u._secrets = u._secrets || {};
  u._secrets[key] = inp.value;
  usersDirty();
  if (inp.value && !String(u[key] || '').trim()) {
    u[key] = suggestUserSecretName(u.handle, key);
    const nameInp = document.getElementById(`usf-${i}-${key}`);
    if (nameInp) nameInp.value = u[key];
  }
}

function removeUser(i) {
  users.splice(i, 1);
  usersDirty();
  refreshUserCards(document.getElementById('user-list'));
}

/** Any manual change to the list means it is no longer placeholder data. */
function usersDirty() {
  usersPristine = false;
  answers['users'] = users;
  markActiveEnvDirty();
}

/* ── Environments manager (E0) ──────────────────────────────────────────── */
/** All environments — on disk and added this session — with state badges and
 *  the explicit controls. No file changes happen here: every operation is
 *  recorded in the session and executed once, by the reviewed batch save. */
function renderEnvManagerStep() {
  snapshotActiveEnv();
  const wrap = document.createElement('div');
  wrap.style.cssText = 'display:flex;flex-direction:column;gap:14px';

  const list = document.createElement('div');
  list.className = 'env-list';
  const defName = currentDefaultName();
  for (const name of envOrder) {
    const e = envs[name];
    const badges = [];
    if (name === defName) badges.push('<span class="env-badge default">⭐ الافتراضية</span>');
    if (!e.existsOnDisk) badges.push('<span class="env-badge new">جديدة</span>');
    else if (e.dirty) badges.push('<span class="env-badge edited">معدّلة</span>');
    else badges.push('<span class="env-badge">على القرص</span>');
    const renameNote = (e.existsOnDisk && e.diskName !== name)
      ? `<div class="env-note">${esc(e.diskName)}.json → ${esc(name)}.json عند الحفظ</div>` : '';
    const row = document.createElement('div');
    row.className = 'env-row';
    row.innerHTML = `
      <span class="env-row-name">${esc(name)}.json</span>
      ${badges.join('')}
      ${renameNote}
      <div class="env-row-actions">
        <button class="btn-sm" data-act="open">✏️ فتح</button>
        <button class="btn-sm" data-act="rename">🏷️ إعادة تسمية</button>
        <button class="btn-sm danger" data-act="delete">🗑️ حذف</button>
      </div>`;
    row.querySelector('[data-act="open"]').onclick = () => { switchEnv(name); goTo(current + 1); };
    row.querySelector('[data-act="rename"]').onclick = () => openRenameDialog(name);
    row.querySelector('[data-act="delete"]').onclick = () => openDeleteDialog(name);
    list.appendChild(row);
  }
  wrap.appendChild(list);

  if (pendingDeletes.length) {
    const note = document.createElement('div');
    note.className = 'ops-list';
    note.innerHTML = `<div class="ops-list-title">🗑️ هتتحذف عند الحفظ (بعد تأكيدك):</div>` +
      pendingDeletes.map(n => `<div class="op-line"><code>environments/${esc(n)}.json</code></div>`).join('');
    wrap.appendChild(note);
  }

  const addBtn = document.createElement('button');
  addBtn.className = 'btn-add';
  addBtn.innerHTML = '+ إضافة بيئة';
  addBtn.onclick = openAddEnvDialog;
  wrap.appendChild(addBtn);

  const hint = document.createElement('div');
  hint.className = 'field-hint';
  hint.textContent = 'مافيش أي ملف بيتغير دلوقتي — كل العمليات بتتنفذ مرة واحدة عند الحفظ، بعد ما تراجعها كلها في الخطوة الأخيرة.';
  wrap.appendChild(hint);
  return wrap;
}

/* ── Modal dialogs — moment-of-action consent (invariant #11) ───────────── */
function openModal(html) {
  closeModal();
  const ov = document.createElement('div');
  ov.className = 'modal-overlay';
  ov.id = 'modal-overlay';
  ov.innerHTML = `<div class="modal-card">${html}</div>`;
  ov.addEventListener('click', e => { if (e.target === ov) closeModal(); });
  document.body.appendChild(ov);
  return ov;
}
function closeModal() {
  const ov = document.getElementById('modal-overlay');
  if (ov) ov.remove();
}

/** Add a new environment: validated name + interactive copy-on-create.
 *  SAFE sections only appear (test users values, defaults values) — the
 *  connection targets (portalUrl / db / api) are never offered. */
function openAddEnvDialog() {
  snapshotActiveEnv();
  const suggestion = ['uat', 'staging', 'dev', 'qa', 'preprod'].find(n => !envNameProblem(n)) || '';
  const sources = envOrder.slice();
  const ov = openModal(`
    <div class="modal-title">➕ إضافة بيئة جديدة</div>
    <div class="modal-body">اختر اسم البيئة — هو نفسه اسم الملف اللي هيتكتب عند الحفظ.</div>
    <div class="field">
      <label class="field-label">اسم البيئة</label>
      <input type="text" id="add-env-name" value="${esc(suggestion)}" placeholder="uat" style="direction:ltr" />
      <div class="field-hint" id="add-env-err"></div>
    </div>
    <div class="copy-opts">
      <label><input type="radio" name="add-mode" value="blank" checked /> ابدأ بيئة فاضية</label>
      <label><input type="radio" name="add-mode" value="copy"${sources.length ? '' : ' disabled'} /> انسخ أقسامًا آمنة من بيئة موجودة</label>
      <div id="copy-section" style="display:none;flex-direction:column;gap:8px;padding-right:24px">
        <select id="copy-src">${sources.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join('')}</select>
        <label><input type="checkbox" id="copy-users" checked /> مستخدمو الاختبار (القيم)</label>
        <label><input type="checkbox" id="copy-defaults" checked /> القيم الافتراضية (القيم بس — من غير الأسرار)</label>
        <div class="field-hint">روابط الاتصال (Portal URL وقاعدة البيانات والـ API) عمرها ما بتتنسخ — البيئة الجديدة بتبدأ من غيرها عشان ماتشاورش على أنظمة بيئة تانية.</div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-primary" id="add-env-ok">إنشاء البيئة</button>
      <button class="btn btn-outline" id="add-env-cancel">إلغاء</button>
    </div>`);
  const copySection = ov.querySelector('#copy-section');
  ov.querySelectorAll('input[name="add-mode"]').forEach(r => {
    r.onchange = () => {
      copySection.style.display =
        ov.querySelector('input[name="add-mode"]:checked').value === 'copy' ? 'flex' : 'none';
    };
  });
  ov.querySelector('#add-env-cancel').onclick = closeModal;
  ov.querySelector('#add-env-ok').onclick = () => {
    const name = ov.querySelector('#add-env-name').value.trim();
    const problem = envNameProblem(name);
    if (problem) { ov.querySelector('#add-env-err').textContent = '❌ ' + problem; return; }
    const mode = ov.querySelector('input[name="add-mode"]:checked').value;
    const opts = mode === 'copy'
      ? { copyFrom: ov.querySelector('#copy-src').value,
          copyUsers: ov.querySelector('#copy-users').checked,
          copyDefaults: ov.querySelector('#copy-defaults').checked }
      : {};
    createEnv(name, opts);
    closeModal();
    switchEnv(name);
    showToast(opts.copyFrom
      ? `🆕 بيئة جديدة «${name}» — اتنسخت الأقسام المختارة من «${opts.copyFrom}»، من غير أي روابط اتصال`
      : `🆕 بيئة جديدة «${name}» — ابدأ من الأول`, 'success');
    renderStep();
  };
  setTimeout(() => ov.querySelector('#add-env-name').focus(), 50);
}

/** Rename: the confirm dialog states the exact file operation before anything
 *  is recorded; renaming the default states that defaultEnvironment follows. */
function openRenameDialog(name) {
  snapshotActiveEnv();
  const e = envs[name];
  if (!e) return;
  const isDefault = currentDefaultName() === name;
  const ov = openModal(`
    <div class="modal-title">🏷️ إعادة تسمية «${esc(name)}»</div>
    ${e.existsOnDisk
      ? `<div class="modal-body">عند الحفظ، الملف الموجود على القرص هيتنقل للاسم الجديد — العملية دي بتتنفذ مرة واحدة بعد ما تراجعها في خطوة المراجعة، ومش هيتلمس أي ملف تاني.</div>`
      : `<div class="modal-body">البيئة دي جديدة ولسه ماتحفظتش — تغيير الاسم هنا بيغيّر اسم الملف اللي هيتكتب، من غير أي عملية على ملفات موجودة.</div>`}
    <div class="field">
      <label class="field-label">الاسم الجديد</label>
      <input type="text" id="rn-name" value="${esc(name)}" style="direction:ltr" />
      <div class="field-hint" id="rn-err"></div>
    </div>
    <div class="modal-fileop" id="rn-fileop"></div>
    ${isDefault ? '<div class="modal-body">⭐ دي البيئة الافتراضية — <code>defaultEnvironment</code> في config/project.json هيتحدّث للاسم الجديد في نفس الحفظة.</div>' : ''}
    <div class="modal-actions">
      <button class="btn btn-primary" id="rn-ok">تأكيد إعادة التسمية</button>
      <button class="btn btn-outline" id="rn-cancel">إلغاء</button>
    </div>`);
  const input = ov.querySelector('#rn-name');
  const fileop = ov.querySelector('#rn-fileop');
  const refreshOp = () => {
    const nn = input.value.trim() || '?';
    fileop.textContent = e.existsOnDisk
      ? `environments/${e.diskName}.json  →  environments/${nn}.json`
      : `environments/${nn}.json (ملف جديد)`;
  };
  input.oninput = refreshOp;
  refreshOp();
  ov.querySelector('#rn-cancel').onclick = closeModal;
  ov.querySelector('#rn-ok').onclick = () => {
    const newName = input.value.trim();
    if (newName === name) { closeModal(); return; }
    // Renaming an ON-DISK file onto a pristine sample's name would collide at
    // execution time — blocked here (forRename); a NEW env may take the name
    // (its write claims the sample). self allows renaming back to the env's
    // own disk name, which cancels its pending rename.
    const problem = envNameProblem(newName, { forRename: e.existsOnDisk, self: name });
    if (problem) { ov.querySelector('#rn-err').textContent = '❌ ' + problem; return; }
    renameSessionEnv(name, newName);
    closeModal();
    showToast(e.existsOnDisk
      ? `🏷️ «${name}» → «${newName}» — الملف هيتنقل عند الحفظ`
      : `🏷️ «${name}» → «${newName}»`, 'success');
    renderStep();
  };
}

/** Delete: never silent. The dialog names the exact file; deleting the default
 *  cannot be confirmed until a new default is designated in the same dialog;
 *  the last environment cannot be deleted at all. */
function openDeleteDialog(name) {
  snapshotActiveEnv();
  const e = envs[name];
  if (!e) return;
  if (envOrder.length <= 1) {
    showToast('❌ لازم تفضل بيئة واحدة على الأقل — ماينفعش حذف آخر بيئة', 'error');
    return;
  }
  const isDefault = currentDefaultName() === name;
  const others = envOrder.filter(n => n !== name);
  const ov = openModal(`
    <div class="modal-title">🗑️ حذف «${esc(name)}»</div>
    ${e.existsOnDisk
      ? `<div class="modal-body">عند الحفظ، الملف ده هيتحذف نهائيًا من القرص — مافيش تراجع بعد الحفظ. العملية بتتنفذ مرة واحدة بعد المراجعة، ومش هيتلمس أي ملف تاني.</div>
         <div class="modal-fileop modal-danger">environments/${esc(e.diskName)}.json — DELETE</div>`
      : `<div class="modal-body">البيئة دي جديدة في الجلسة ولسه ماتحفظتش — هتتشال من الجلسة بس، من غير أي عملية على القرص.</div>`}
    ${isDefault ? `
      <div class="modal-body">⭐ دي البيئة الافتراضية — لازم تختار بيئة افتراضية جديدة قبل تأكيد الحذف، عشان <code>defaultEnvironment</code> مايشاورش على ملف مش موجود.</div>
      <div class="field">
        <label class="field-label">البيئة الافتراضية الجديدة</label>
        <select id="del-new-default">
          <option value="">— اختر —</option>
          ${others.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join('')}
        </select>
      </div>` : ''}
    <div class="modal-actions">
      <button class="btn btn-danger" id="del-ok"${isDefault ? ' disabled' : ''}>تأكيد الحذف</button>
      <button class="btn btn-outline" id="del-cancel">إلغاء</button>
    </div>`);
  if (isDefault) {
    ov.querySelector('#del-new-default').onchange = ev => {
      ov.querySelector('#del-ok').disabled = !ev.target.value;
    };
  }
  ov.querySelector('#del-cancel').onclick = closeModal;
  ov.querySelector('#del-ok').onclick = () => {
    if (isDefault) {
      const nd = ov.querySelector('#del-new-default').value;
      if (!nd) return;
      newDefaultName = nd;
    }
    if (e.existsOnDisk) pendingDeletes.push(e.diskName);
    delete envs[name];
    envOrder = envOrder.filter(n => n !== name);
    if (activeEnv === name) { activeEnv = null; restoreEnv(envOrder[0]); }
    closeModal();
    showToast(e.existsOnDisk ? `🗑️ «${name}» هتتحذف عند الحفظ` : `🗑️ اتشالت «${name}» من الجلسة`, 'warn');
    renderStep();
  };
}

/* ── Field-set editor (design #4) — add / rename / remove / secret / reorder ─
 * An affordance on the users page (userFields) and the defaults section
 * (defaultsFields), never a step. Rename records the migration; remove asks
 * inline with its blast radius; everything is listed again on the review. */
function openFieldEditor(kind) {
  snapshotActiveEnv();
  renderFieldEditor(kind, {});
}

function fieldEditorRowHTML(kind, f, i, n, state) {
  const key = f.key;
  if (state.editing === key) {
    return `<div class="env-row" data-key="${esc(key)}">
      <input type="text" class="fe-edit-key" value="${esc(key)}" style="direction:ltr;font-family:var(--mono);flex:1;min-width:100px" />
      <input type="text" class="fe-edit-label" value="${esc(f.label || '')}" placeholder="الاسم المعروض" style="flex:1;min-width:100px" />
      <div class="env-row-actions">
        <button class="btn-sm" data-act="edit-ok">حفظ</button>
        <button class="btn-sm" data-act="edit-cancel">إلغاء</button>
      </div>
      <div class="field-hint fe-edit-err" style="width:100%"></div>
    </div>`;
  }
  if (state.removing === key) {
    const blast = kind === 'user' ? userFieldBlastRadius(key) : defaultsFieldBlastRadius(key);
    const msg = blast.length
      ? `في قيم محفوظة تحت «${esc(key)}» في ${blast.length === 1 ? 'بيئة واحدة' : blast.length + ' بيئات'} (${blast.map(esc).join('، ')}) — هتتشال من الملفات عند الحفظ.`
      : `مافيش قيم محفوظة تحت «${esc(key)}» في أي بيئة.`;
    return `<div class="env-row" data-key="${esc(key)}" style="border-color:rgba(220,38,38,.35)">
      <div class="modal-body" style="width:100%">🗑️ حذف حقل «${esc(f.label || key)}»؟ ${msg}</div>
      <div class="env-row-actions">
        <button class="btn-sm danger" data-act="remove-ok">تأكيد الحذف</button>
        <button class="btn-sm" data-act="remove-cancel">إلغاء</button>
      </div>
    </div>`;
  }
  if (state.renonto && state.renonto.from === key) {
    const r = state.renonto;
    return `<div class="env-row" data-key="${esc(key)}" style="border-color:rgba(217,119,6,.35)">
      <div class="modal-body" style="width:100%">⚠️ في قيم يدوية محفوظة على القرص تحت «${esc(r.to)}» في ${r.envs.length === 1 ? 'بيئة واحدة' : r.envs.length + ' بيئات'} (${r.envs.map(esc).join('، ')}) مختلفة عن قيم الحقل — لو أكّدت، قيم الجلسة هتتكتب فوقها عند الحفظ، والخانة الفاضية هتشيل قيمة القرص. العملية هتظهر في قائمة عمليات المراجعة.</div>
      <div class="env-row-actions">
        <button class="btn-sm danger" data-act="renonto-ok">تأكيد الكتابة فوقها</button>
        <button class="btn-sm" data-act="renonto-cancel">إلغاء</button>
      </div>
    </div>`;
  }
  if (state.toggling === key) {
    const blast = kind === 'user' ? userFieldBlastRadius(key) : defaultsFieldBlastRadius(key);
    return `<div class="env-row" data-key="${esc(key)}" style="border-color:rgba(217,119,6,.35)">
      <div class="modal-body" style="width:100%">🔒 التبديل بين نصي وسرّي بيمسح القيم المحفوظة تحت «${esc(key)}» في ${blast.length === 1 ? 'بيئة واحدة' : blast.length + ' بيئات'} — القيمة النصية عمرها ما بتتحول لاسم متغير بصمت. تأكيد؟</div>
      <div class="env-row-actions">
        <button class="btn-sm" data-act="toggle-ok">تأكيد</button>
        <button class="btn-sm" data-act="toggle-cancel">إلغاء</button>
      </div>
    </div>`;
  }
  const badges = [];
  if (f.secret) badges.push('<span class="env-badge">🔒 سرّي</span>');
  if (f.type && f.type !== 'text') badges.push(`<span class="env-badge">${esc(f.type)}</span>`);
  if (f._orig && f._orig !== f.key) badges.push(`<span class="env-badge edited">${esc(f._orig)} ← ${esc(f.key)}</span>`);
  if (!f._orig) badges.push('<span class="env-badge new">جديد</span>');
  return `<div class="env-row" data-key="${esc(key)}">
    <span class="env-row-name">${esc(key)}</span>
    <span style="font-size:12px;color:var(--text-2)">${esc(f.label || '')}</span>
    ${badges.join('')}
    <div class="env-row-actions">
      <button class="btn-sm" data-act="up"${i === 0 ? ' disabled' : ''}>⬆</button>
      <button class="btn-sm" data-act="down"${i === n - 1 ? ' disabled' : ''}>⬇</button>
      <button class="btn-sm" data-act="edit">✏️ إعادة تسمية</button>
      <button class="btn-sm" data-act="secret">${f.secret ? '🔓 إلغاء السرية' : '🔒 اجعله سرّيًا'}</button>
      <button class="btn-sm danger" data-act="remove">🗑️</button>
    </div>
  </div>`;
}

function renderFieldEditor(kind, state) {
  const list = fieldList(kind);
  const title = kind === 'user' ? '⚙️ حقول مستخدمي الاختبار' : '⚙️ حقول القيم الافتراضية';
  const rows = list.map((f, i) => fieldEditorRowHTML(kind, f, i, list.length, state)).join('') ||
    '<div class="field-hint">مافيش حقول معرّفة — أضف أول حقل من الفورم اللي تحت.</div>';
  const ov = openModal(`
    <div class="modal-title">${title}</div>
    <div class="modal-body">الحقول دي معرّفة مرة واحدة في config/project.json ومشتركة بين كل البيئات — أي تعديل هنا بيتطبق على ${kind === 'user' ? 'كل مستخدم في كل بيئة' : 'كل البيئات'} عند الحفظ، وهيظهر في قائمة العمليات في خطوة المراجعة.${kind === 'user' ? ' حقل «المعرّف» (handle) ثابت — هو مفتاح المستخدم ومش بيتغير من هنا.' : ''}</div>
    <div class="env-list" id="fe-rows">${rows}</div>
    <div class="field" style="border-top:1px solid var(--border);padding-top:12px">
      <label class="field-label">➕ إضافة حقل جديد</label>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <input type="text" id="fe-add-key" placeholder="national_id" style="direction:ltr;font-family:var(--mono);flex:1;min-width:120px" />
        <input type="text" id="fe-add-label" placeholder="الاسم المعروض" style="flex:1;min-width:120px" />
      </div>
      <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
        <select id="fe-add-type" style="width:auto">
          <option value="text">text</option><option value="email">email</option>
          <option value="number">number</option><option value="url">url</option>
        </select>
        <label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer">
          <input type="checkbox" id="fe-add-secret" style="width:auto;accent-color:var(--accent)" /> 🔒 سرّي (القيمة في ‎.env باسم متغير)
        </label>
        <button class="btn-sm" id="fe-add-ok">إضافة</button>
      </div>
      <div class="field-hint" id="fe-add-err"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-primary" id="fe-done">تم</button>
    </div>`);
  // Closing by clicking the overlay must still refresh the step behind it.
  ov.addEventListener('click', e => { if (e.target === ov) renderStep(); });

  ov.querySelectorAll('#fe-rows .env-row').forEach(row => {
    const key = row.getAttribute('data-key');
    if (!key) return;
    const on = (a, fn) => { const b = row.querySelector(`[data-act="${a}"]`); if (b) b.onclick = fn; };
    on('up',   () => { moveField(kind, key, -1); renderFieldEditor(kind, {}); });
    on('down', () => { moveField(kind, key, +1); renderFieldEditor(kind, {}); });
    on('edit', () => renderFieldEditor(kind, { editing: key }));
    on('edit-cancel', () => renderFieldEditor(kind, {}));
    on('edit-ok', () => {
      const newKey = row.querySelector('.fe-edit-key').value.trim();
      const newLabel = row.querySelector('.fe-edit-label').value.trim();
      const problem = fieldKeyProblem(kind, newKey, key);
      if (problem) { row.querySelector('.fe-edit-err').textContent = '❌ ' + problem; return; }
      // Renaming ONTO a key that holds hand-added disk values which would be
      // overwritten (or lost to a shape mismatch) needs explicit consent —
      // never silent (invariant #11).
      if (newKey !== key) {
        const conflicts = renameOntoConflicts(kind, key, newKey);
        if (conflicts.length) {
          renderFieldEditor(kind, { renonto: { from: key, to: newKey, label: newLabel, envs: conflicts } });
          return;
        }
      }
      const adopted = renameFieldAdopting(kind, key, newKey, newLabel);
      if (newKey !== key) {
        showToast(adopted
          ? `🏷️ «${key}» ← «${newKey}» — المفتاح هيتنقل في كل البيئات، والقيم الموجودة على القرص تحت الاسم الجديد اتحمّلت في الخانات`
          : `🏷️ «${key}» ← «${newKey}» — المفتاح هيتنقل في كل البيئات عند الحفظ`, 'success');
      }
      renderFieldEditor(kind, {});
    });
    on('renonto-cancel', () => renderFieldEditor(kind, {}));
    on('renonto-ok', () => {
      renameFieldAdopting(kind, state.renonto.from, state.renonto.to, state.renonto.label);
      showToast(`🏷️ «${state.renonto.from}» ← «${state.renonto.to}» — الكتابة فوق القيم اليدوية اتأكّدت وهتظهر في المراجعة`, 'warn');
      renderFieldEditor(kind, {});
    });
    on('secret', () => {
      const blast = kind === 'user' ? userFieldBlastRadius(key) : defaultsFieldBlastRadius(key);
      if (blast.length) { renderFieldEditor(kind, { toggling: key }); return; }
      toggleFieldSecret(kind, key);
      renderFieldEditor(kind, {});
    });
    on('toggle-cancel', () => renderFieldEditor(kind, {}));
    on('toggle-ok', () => { toggleFieldSecret(kind, key); renderFieldEditor(kind, {}); });
    on('remove', () => renderFieldEditor(kind, { removing: key }));
    on('remove-cancel', () => renderFieldEditor(kind, {}));
    on('remove-ok', () => {
      removeField(kind, key);
      showToast(`🗑️ اتشال حقل «${key}» — هيختفي من كل البيئات عند الحفظ`, 'warn');
      renderFieldEditor(kind, {});
    });
  });
  ov.querySelector('#fe-add-ok').onclick = () => {
    const key = ov.querySelector('#fe-add-key').value.trim();
    const problem = fieldKeyProblem(kind, key);
    if (problem) { ov.querySelector('#fe-add-err').textContent = '❌ ' + problem; return; }
    const secret = ov.querySelector('#fe-add-secret').checked;
    // Hand-added disk values under this key must survive: matching shapes are
    // adopted below; a shape mismatch is refused with guidance, never lost.
    const shape = fieldAddShapeConflict(kind, key, secret);
    if (shape) { ov.querySelector('#fe-add-err').textContent = '❌ ' + shape; return; }
    const desc = { key, label: ov.querySelector('#fe-add-label').value.trim() || key };
    const type = ov.querySelector('#fe-add-type').value;
    if (type && type !== 'text') desc.type = type;
    if (secret) desc.secret = true;
    const adopted = addField(kind, desc);
    showToast(adopted
      ? `📥 اتضاف حقل «${key}» — القيم الموجودة على القرص تحته اتحمّلت في الخانات، راجعها قبل الحفظ`
      : `➕ اتضاف حقل «${key}» لكل ${kind === 'user' ? 'المستخدمين في كل البيئات' : 'البيئات'}`, 'success');
    renderFieldEditor(kind, {});
  };
  ov.querySelector('#fe-done').onclick = () => { closeModal(); renderStep(); };
}

/* ── File pick / extract (used by the file-import screen) ─────────────────── */
function pickFile(file) {
  if (!file) return;
  window._file = file;
  document.getElementById('fn').textContent = file.name;
  document.getElementById('fs').textContent = fmtBytes(file.size);
  document.getElementById('file-ready').classList.add('show');
  document.getElementById('dz').style.display = 'none';
  document.getElementById('ep').classList.remove('show');
}

async function runExtract() {
  const btn = document.getElementById('btn-ex');
  btn.innerHTML = '<div class="spin"></div>';
  btn.disabled = true;
  try {
    if (MODE === 'local') {
      const fd = new FormData(); fd.append('file', window._file);
      const r = await apiFetch('/api/extract', { method:'POST', body:fd });
      const data = await r.json();
      if (!r.ok || data.error) {
        // e.g. a binary PDF/Word — refuse honestly, never fake a success preview.
        showToast('❌ ' + (data.message || data.error || 'فشل الاستخلاص'), 'error');
        return;
      }
      extractedData = data;
    } else {
      const t = await window._file.text();
      extractedData = { _raw: t.substring(0,500) };
    }
    document.getElementById('ep-code').textContent = JSON.stringify(extractedData, null, 2);
    document.getElementById('ep').classList.add('show');
  } catch(e) { showToast('فشل الاستخلاص: ' + e.message, 'error'); }
  finally { btn.innerHTML = '🤖 استخلاص البيانات'; btn.disabled = false; }
}

function resetFile() {
  window._file = null;
  document.getElementById('fi').value = '';
  document.getElementById('file-ready').classList.remove('show');
  document.getElementById('ep').classList.remove('show');
  document.getElementById('dz').style.display = '';
}

function applyExtracted(data) {
  let touchedEnvScoped = false;
  function flat(obj, p='') {
    for (const [k,v] of Object.entries(obj||{})) {
      const key = p ? `${p}.${k}` : k;
      if (v && typeof v==='object' && !Array.isArray(v)) flat(v, key);
      else if (key !== 'users' && key !== 'envName' && !key.startsWith('_') && !answers[key]) {
        answers[key] = v;
        if (envScopedKeys().includes(key)) touchedEnvScoped = true;
      }
    }
  }
  flat(data);
  if (touchedEnvScoped) markActiveEnvDirty();
  // An extracted environment name renames the CURRENT session environment only
  // when it is a fresh, never-saved one — an on-disk environment's name changes
  // only through the explicit rename dialog (invariant #11).
  const extractedName = data && String(data.envName || '').trim();
  if (extractedName && activeEnv && envs[activeEnv] && !envs[activeEnv].existsOnDisk &&
      extractedName !== activeEnv && !envNameProblem(extractedName)) {
    renameSessionEnv(activeEnv, extractedName);
  }
  if (Array.isArray(data.users) && data.users.length > 0) {
    // Mirror of engine.js mergeUsers(): imports MERGE by handle — they never
    // replace users the user typed or that came from an existing config
    // (saving afterwards would erase them on disk). Only the untouched
    // starter placeholders give way to an import.
    if (usersPristine) {
      users = data.users.map(u => ({ ...u }));
    } else {
      for (const ext of data.users) {
        if (!ext || !ext.handle) continue;
        const hit = users.find(u => u.handle === ext.handle);
        if (hit) { for (const [k,v] of Object.entries(ext)) { if (v && !hit[k]) hit[k] = v; } }
        else users.push({ ...ext });
      }
    }
    usersPristine = false;
    answers['users'] = users;
    markActiveEnvDirty();
  }
}

/* ── Review Step ─────────────────────────────────────────────────────────── */
/** Environments this save writes: added this session, or edited this session.
 *  A clean on-disk environment is not rewritten (its file already says this). */
function dirtyEnvNames() {
  return envOrder.filter(n => envs[n].dirty || !envs[n].existsOnDisk);
}

function renderReviewStep() {
  snapshotActiveEnv();
  const step = schema.steps[current];
  const projectConfig = buildProjectConfig();
  const writes = dirtyEnvNames();
  const renames = deriveRenames();

  // One tab per output file, straight from the schema's file-keyed outputs —
  // the environments/{envName}.json output expands to one tab per environment
  // file this save writes. Page order groups by file, review groups by file,
  // the save writes by file: one story, told three times the same way.
  const tabs = [];
  for (const o of (step.outputs || [])) {
    if (o.key === 'projectConfig') tabs.push({ label: String(o.file || ''), data: projectConfig });
    else if (o.key === 'envConfig') {
      for (const n of writes) tabs.push({ label: `environments/${n}.json`, data: buildEnvConfig(n) });
    }
  }
  const wrap = document.createElement('div');
  wrap.style.cssText = 'display:flex;flex-direction:column;gap:14px';

  const tabBar = document.createElement('div');
  tabBar.className = 'rtabs';
  tabBar.style.flexWrap = 'wrap';
  tabs.forEach((t, i) => {
    const btn = document.createElement('button');
    btn.className = `rtab${i===0?' active':''}`;
    btn.textContent = t.label;
    btn.onclick = () => {
      tabBar.querySelectorAll('.rtab').forEach((el,j) => el.classList.toggle('active',j===i));
      code.textContent = JSON.stringify(tabs[i].data, null, 2);
    };
    tabBar.appendChild(btn);
  });

  const code = document.createElement('pre');
  code.className = 'code-view';
  code.textContent = JSON.stringify(tabs[0].data, null, 2);

  const copyBtn = document.createElement('button');
  copyBtn.className = 'btn-copy';
  copyBtn.textContent = '📋 نسخ';
  copyBtn.style.alignSelf = 'flex-start';
  copyBtn.onclick = () => navigator.clipboard.writeText(code.textContent)
    .then(() => showToast('تم النسخ', 'success'), () => showToast('تعذر النسخ', 'error'));

  wrap.appendChild(tabBar);
  wrap.appendChild(code);
  wrap.appendChild(copyBtn);

  // ── The operations list: EVERY file operation this one save performs —
  // listed here, before anything happens (the second half of the double
  // consent; each rename/delete was already confirmed in its own dialog).
  const ops = document.createElement('div');
  ops.className = 'ops-list';
  const lines = [];
  for (const t of tabs) lines.push(`<div class="op-line">✍️ هيتكتب <code>${esc(t.label)}</code></div>`);
  for (const r of renames) lines.push(`<div class="op-line">🏷️ إعادة تسمية مؤكّدة: <code>environments/${esc(r.from)}.json → environments/${esc(r.to)}.json</code></div>`);
  for (const d of pendingDeletes) lines.push(`<div class="op-line">🗑️ حذف مؤكّد: <code>environments/${esc(d)}.json</code></div>`);
  // Field-schema ops (design #4): renames migrate the key in EVERY environment
  // file this save writes; removals drop the consented values — both listed
  // here before anything happens, like every other file operation.
  for (const r of deriveUserFieldRenames()) {
    lines.push(`<div class="op-line">🔧 إعادة تسمية حقل مستخدم: <code>${esc(r.from)} → ${esc(r.to)}</code> — المفتاح بيتنقل في كل ملفات البيئات</div>`);
  }
  for (const r of deriveDefaultsFieldRenames()) {
    lines.push(`<div class="op-line">🔧 إعادة تسمية حقل افتراضي: <code>defaults.${esc(r.from)} → defaults.${esc(r.to)}</code> — المفتاح بيتنقل في كل ملفات البيئات</div>`);
  }
  for (const x of removedUserFields) {
    lines.push(`<div class="op-line">🗑️ حذف حقل مستخدم مؤكّد: <code>${esc(x.key)}</code>${x.envs.length ? ` — القيم اللي تحته في ${x.envs.length === 1 ? 'بيئة واحدة' : x.envs.length + ' بيئات'} هتتشال من الملفات` : ' — مافيش قيم محفوظة تحته'}</div>`);
  }
  for (const x of removedDefaultsFields) {
    lines.push(`<div class="op-line">🗑️ حذف حقل افتراضي مؤكّد: <code>defaults.${esc(x.key)}</code>${x.envs.length ? ` — القيم اللي تحته في ${x.envs.length === 1 ? 'بيئة واحدة' : x.envs.length + ' بيئات'} هتتشال من الملفات` : ' — مافيش قيم محفوظة تحته'}</div>`);
  }
  for (const x of overwrittenUserKeys) {
    lines.push(`<div class="op-line">✏️ كتابة مؤكّدة فوق قيم يدوية: <code>${esc(x.key)}</code> — قيم القرص تحته في ${x.envs.length === 1 ? 'بيئة واحدة' : x.envs.length + ' بيئات'} هتتكتب فوقها قيم الجلسة</div>`);
  }
  for (const x of overwrittenDefaultsKeys) {
    lines.push(`<div class="op-line">✏️ كتابة مؤكّدة فوق قيم يدوية: <code>defaults.${esc(x.key)}</code> — قيم القرص تحته في ${x.envs.length === 1 ? 'بيئة واحدة' : x.envs.length + ' بيئات'} هتتكتب فوقها قيم الجلسة</div>`);
  }
  const untouched = envOrder.filter(n => envs[n].existsOnDisk && !envs[n].dirty && envs[n].diskName === n);
  if (untouched.length) {
    lines.push(`<div class="op-line">🔒 من غير أي تغيير: ${untouched.map(n => `<code>environments/${esc(n)}.json</code>`).join('، ')}</div>`);
  }
  lines.push(`<div class="op-line">⭐ البيئة الافتراضية: <code>${esc(currentDefaultName() || '?')}</code></div>`);
  ops.innerHTML = `<div class="ops-list-title">📋 العمليات اللي هتتنفذ عند الحفظ:</div>` + lines.join('');
  wrap.appendChild(ops);

  // .env keys summary — names only, never values (invariant #5). The secret
  // fields' "محفوظ بشكل آمن" note promised safe keeping; this says where.
  const secretKeys = Object.keys(buildSecretsPayload());
  const envSum = document.createElement('div');
  envSum.className = 'env-summary';
  envSum.innerHTML = secretKeys.length
    ? `<div class="env-summary-title">🔐 ‎.env — المفاتيح اللي هتتكتب (الأسماء فقط، القيم عمرها ما بتتعرض):</div>
       <div class="env-keys">${secretKeys.map(k => `<span class="env-key">${esc(k)}</span>`).join('')}</div>`
    : `<div class="env-summary-title">🔐 ‎.env — مافيش أسرار جديدة في الجلسة دي، الملف مش هيتغير.</div>`;
  wrap.appendChild(envSum);

  // Reconciliation transparency: the save removes EVERY structurally-pristine
  // leftover sample this session does not claim (write / rename / delete) —
  // all listed here BEFORE anything happens, never silently.
  const claimed = new Set([...writes, ...renames.map(r => r.to), ...renames.map(r => r.from), ...pendingDeletes]);
  const toReconcile = pristineSamples.filter(n => !claimed.has(n));
  if (toReconcile.length) {
    const files = toReconcile.map(n => `environments/${n}.json`).join('، ');
    const note = document.createElement('div');
    note.style.cssText = 'border:1px solid var(--warning);background:var(--warning-lt);color:var(--text-1);border-radius:10px;padding:10px 14px;font-size:13px;line-height:1.7';
    note.textContent = toReconcile.length === 1
      ? `⚠️ عند الحفظ هيتشال ملف البيئة النموذجي ${files} (نسخة السكافولد من غير أي تعديل) — بيئاتك الحقيقية بتحل محله.`
      : `⚠️ عند الحفظ هتتشال ملفات البيئة النموذجية دي (نسخ السكافولد من غير أي تعديل): ${files} — بيئاتك الحقيقية بتحل محلها.`;
    wrap.appendChild(note);
  }
  return wrap;
}

/* ── Footer ─────────────────────────────────────────────────────────────── */
function renderFooter(step) {
  const isFirst = current === 0;
  const isLast  = current === schema.steps.length - 1;

  const foot = document.createElement('div');
  foot.className = 'card-foot';

  const left = document.createElement('div');
  left.className = 'foot-left';

  // Back
  if (!isFirst) {
    const back = document.createElement('button');
    back.className = 'btn btn-outline';
    back.innerHTML = '→ السابق';
    back.onclick = prev;
    left.appendChild(back);
  } else {
    const home = document.createElement('button');
    home.className = 'btn-ghost';
    home.innerHTML = '→ الرئيسية';
    home.onclick = renderIntro;
    left.appendChild(home);
  }
  foot.appendChild(left);

  // Skip
  if (step.optional && !isLast) {
    const skip = document.createElement('button');
    skip.className = 'btn-text';
    skip.textContent = 'تخطي';
    skip.onclick = () => goTo(current + 1);
    foot.appendChild(skip);
  }

  // Next / Save
  const nextBtn = document.createElement('button');
  nextBtn.className = isLast ? 'btn btn-success' : 'btn btn-primary';
  nextBtn.innerHTML = isLast ? '💾 حفظ' : 'التالي ←';
  nextBtn.onclick = isLast ? saveAndClose : next;
  foot.appendChild(nextBtn);

  return foot;
}

/* ── Navigation ──────────────────────────────────────────────────────────── */
// Block advancing while the current step has invalid values (required / url / email).
// Mirrors engine.js validate(); the server re-checks on save as defense-in-depth.
function validateStep() {
  const step = schema.steps[current];
  const errs = [];
  for (const f of (step.fields || [])) {
    const v = String(answers[f.key] ?? '').trim();
    if (f.required && !v) { errs.push(`«${f.label || f.key}» مطلوب`); continue; }
    if (!v) continue;
    if (f.type === 'url') {
      let ok = false;
      try { const u = new URL(v); ok = u.protocol === 'http:' || u.protocol === 'https:'; } catch {}
      if (!ok) errs.push(`«${f.label || f.key}» يجب أن يكون رابط http(s) صحيحاً`);
    }
    if (f.type === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) {
      errs.push(`«${f.label || f.key}» بريد إلكتروني غير صحيح`);
    }
    if (f.pattern && !new RegExp(f.pattern).test(v)) {
      errs.push(`«${f.label || f.key}»: ${f.patternMsg || 'قيمة غير صالحة'}`);
    }
  }
  if (step.type === 'dynamic-list') {
    for (const u of users) {
      const hasData = userFieldsSession.some(f => u[f.key] || (u._secrets && u._secrets[f.key]));
      if (hasData && !String(u.handle || '').trim()) { errs.push('كل مستخدم يحتاج «معرّف» قبل المتابعة'); break; }
    }
    const withHandle = users.filter(u => String(u.handle || '').trim()).length;
    if (withHandle < (step.minItems || 1)) {
      errs.push('أضف مستخدم اختبار واحداً على الأقل (بمعرّف)');
    }
    // Schema-driven per-user checks: required fields, secret env-var names.
    for (const f of userFieldsSession) {
      if (f.required && users.some(u => String(u.handle || '').trim() &&
          !(f.secret ? ((u._secrets && u._secrets[f.key]) || u[f.key]) : u[f.key]))) {
        errs.push(`«${f.label || f.key}» مطلوب لكل مستخدم`);
      }
      if (f.secret && users.some(u => u[f.key] && !ENV_VAR_RE_UI.test(String(u[f.key]).trim()))) {
        errs.push(`«${f.label || f.key}»: اسم متغير بيئة صالح فقط — حروف إنجليزية وأرقام و _ بدون مسافات`);
      }
    }
  }
  if (step.defaultsSection) {
    for (const f of defaultsFieldsSession) {
      const label = f.label || f.key;
      if (f.secret) {
        const n = String(answers[`defaults.${f.key}EnvVar`] || '').trim();
        if (n && !ENV_VAR_RE_UI.test(n)) errs.push(`«${label}»: اسم متغير بيئة صالح فقط — حروف إنجليزية وأرقام و _ بدون مسافات`);
        if (f.required && !n) errs.push(`«${label}» مطلوب`);
        continue;
      }
      const v = String(answers[`defaults.${f.key}`] || '').trim();
      if (f.required && !v && !f.default) errs.push(`«${label}» مطلوب`);
      if (v && f.type === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) errs.push(`«${label}» بريد إلكتروني غير صحيح`);
      if (v && f.type === 'url') {
        let ok = false;
        try { const u = new URL(v); ok = u.protocol === 'http:' || u.protocol === 'https:'; } catch {}
        if (!ok) errs.push(`«${label}» يجب أن يكون رابط http(s) صحيحًا`);
      }
    }
  }
  if (errs.length) showToast('❌ ' + errs[0], 'error');
  return errs.length === 0;
}

function next() { collectAnswers(); if (!validateStep()) return; if (current < schema.steps.length-1) goTo(current+1); }
function prev() { collectAnswers(); if (current > 0) goTo(current-1); }

function goTo(idx) {
  if (finished) return;   // the wizard is over — nothing to navigate to
  collectAnswers();
  current = idx;
  renderStep();
  window.scrollTo({ top:0, behavior:'smooth' });
}

function collectAnswers() {
  // Field inputs sync through their own listeners; only the users list needs
  // an explicit refresh here.
  answers['users'] = users;
}

/**
 * Map typed secrets to the env var names they will live under in .env.
 * Project-scoped secret fields read the global store; environment-scoped ones
 * (db/api) are collected from EVERY session environment, each resolving its
 * own envKeyFrom answer — so two environments keep separate secret slots
 * (API_TOKEN / API_TOKEN_UAT). When the step has a sibling "env var name"
 * answer (envKeyFrom), THAT name wins: it is the one the JSON's envSecret
 * references, so writing anywhere else produces a broken config.
 * Call after snapshotActiveEnv() so the active environment's answers are fresh.
 */
function buildSecretsPayload() {
  const out = {};
  for (const step of schema.steps) {
    for (const f of (step.fields || [])) {
      if (!f.secret) continue;
      if (step.group === 'environment') {
        for (const n of envOrder) {
          const v = envs[n].secrets[f.key];
          if (!v) continue;
          let envKey = f.envKey;
          if (f.envKeyFrom) {
            const chosen = String(envs[n].answers[f.envKeyFrom] || '').trim();
            if (chosen) envKey = chosen;
          }
          out[envKey] = v;
        }
      } else {
        if (!secrets[f.key]) continue;
        let envKey = f.envKey;
        if (f.envKeyFrom) {
          const chosen = String(answers[f.envKeyFrom] || '').trim();
          if (chosen) envKey = chosen;
        }
        out[envKey] = secrets[f.key];
      }
    }
  }
  // Custom secret fields (design #4): per-user and per-defaults typed values,
  // each under the env-var NAME its JSON { envSecret } references — the
  // typed name wins, the owner-confirmed prefill fills an empty one.
  for (const n of envOrder) {
    const e = envs[n];
    for (const f of userFieldsSession) {
      if (!f.secret) continue;
      for (const u of e.users) {
        const v = u._secrets && u._secrets[f.key];
        if (!v || !String(u.handle || '').trim()) continue;
        const name = String(u[f.key] || '').trim() || suggestUserSecretName(u.handle, f.key);
        out[name] = v;
      }
    }
    for (const f of defaultsFieldsSession) {
      if (!f.secret) continue;
      const v = e.secrets[`defaults.${f.key}`];
      if (!v) continue;
      const name = String(e.answers[`defaults.${f.key}EnvVar`] || '').trim() || suggestDefaultsSecretName(f.key);
      out[name] = v;
    }
  }
  return out;
}

/* ── Build Configs ───────────────────────────────────────────────────────── */
function buildProjectConfig() {
  // Start from what's on disk so keys the wizard has no input for (azure.areaPath,
  // kb.org, custom fields) survive a re-run instead of being silently dropped.
  const proj = Object.assign({}, existingProject, {
    name: answers['name'] || 'my-project',
    // Never silently re-pointed: currentDefaultName() keeps a valid existing
    // default (following its confirmed rename), moves a deleted default to the
    // user-designated replacement, and lets the first configured environment
    // claim a default that was scaffolding or missing.
    defaultEnvironment: currentDefaultName() || 'qc',   // 'qc' mirrors engine.js DEFAULT_ENV_NAME
    login: Object.assign({}, existingProject && existingProject.login, { mode: answers['login.mode'] || 'session' }),
    // The EFFECTIVE field schema is always written (design #4) — explicit
    // round-trip, no hidden divergence between "absent" and "default".
    userFields: userFieldsSession.map(cleanDescriptor),
    defaultsFields: defaultsFieldsSession.map(cleanDescriptor),
  });
  // Managed keys mirror the screen EXACTLY: a value sets the key, an empty
  // field unsets it — clearing Org must not resurrect the saved value, and
  // filling only Team/Assignee must not drop them. Hand-added keys the wizard
  // has no input for are preserved; a block disappears only when nothing is
  // left in it.
  setManagedBlock(proj, 'azure', ['org', 'project', 'team', 'assignee']);
  setManagedBlock(proj, 'kb', ['baseUrl', 'project']);
  return proj;
}

/** Build one environment's file content from its session entry, merging onto
 *  its own on-disk JSON so values the wizard does not manage survive
 *  (invariant #11) — except keys the user removed/renamed this session
 *  (consented drops). The defaults block iterates the shared defaultsFields.
 *  Call after snapshotActiveEnv(). */
function buildEnvConfig(name) {
  const e = envs[name];
  const a = e.answers;
  const base = e.loadedFrom || null;
  const defaults = Object.assign({}, base && base.defaults);
  for (const k of defaultsFieldDropKeys()) delete defaults[k];
  for (const f of defaultsFieldsSession) {
    if (f.secret) {
      const n = String(a[`defaults.${f.key}EnvVar`] || '').trim();
      if (n) defaults[f.key] = { envSecret: n }; else delete defaults[f.key];
      continue;
    }
    const raw = a[`defaults.${f.key}`];
    const v = (raw !== undefined && raw !== '') ? raw : (f.default !== undefined ? f.default : '');
    if (v) defaults[f.key] = v; else delete defaults[f.key];
  }
  const env = Object.assign({}, base, {
    portalUrl: a['portalUrl'] || '',
    defaults,
    users: buildUsersObj(e),
  });
  if (a['db.server']) {
    env.db = {
      server: a['db.server'],
      port:   Number(a['db.port']) || 1433,
      name:   a['db.name']   || '',
      user:   a['db.user']   || '',
      password: { envSecret: a['db.passwordEnvVar'] || 'SQLCMDPASSWORD' },
    };
  } else {
    delete env.db;    // cleared on screen → removed from the file, not restored
  }
  if (a['api.baseUrl']) {
    env.api = {
      baseUrl: a['api.baseUrl'],
      token:   { envSecret: a['api.tokenEnvVar'] || 'API_TOKEN' },
    };
  } else {
    delete env.api;
  }
  return env;
}

/** Write a group's managed keys from answers into target — set or unset, screen wins. */
function setManagedBlock(target, group, keys) {
  const block = Object.assign({}, existingProject && existingProject[group]);
  for (const k of keys) {
    const v = String(answers[`${group}.${k}`] || '').trim();
    if (v) block[k] = v; else delete block[k];
  }
  if (Object.keys(block).length) target[group] = block;
  else delete target[group];
}

/** Mirror of engine.js buildEnvUsers(): each entry merges onto its on-disk
 *  base entry, so hand-added per-user props the wizard has no input for
 *  survive — except this session's consented drops (removed/renamed keys).
 *  Managed keys come from the shared userFields schema: a secret field's
 *  screen value is an env-var NAME stored as { envSecret }; set or unset,
 *  screen wins. `_`-prefixed session props (typed secret values) never land
 *  in the JSON. */
function buildUsersObj(e) {
  const base = (e.loadedFrom && e.loadedFrom.users) || {};
  const drops = userFieldDropKeys();
  const obj = {};
  for (const u of e.users) {
    if (!u.handle) continue;
    const entry = Object.assign({}, base[u.handle]);
    for (const k of drops) delete entry[k];
    for (const f of userFieldsSession) {
      if (f.secret) {
        const n = String(u[f.key] || '').trim();
        if (n) entry[f.key] = { envSecret: n }; else delete entry[f.key];
      } else if (u[f.key]) {
        entry[f.key] = u[f.key];
      } else {
        delete entry[f.key];
      }
    }
    obj[u.handle] = entry;
  }
  return obj;
}

/* ── Save ────────────────────────────────────────────────────────────────── */
async function saveAndClose() {
  collectAnswers();
  snapshotActiveEnv();

  // Client-side gate before the batch save (the server re-validates everything
  // via planSave): every environment this save writes must be internally
  // complete — the review can only be reached through the active environment's
  // pages, so the OTHER environments get their completeness check here.
  const writes = dirtyEnvNames();
  for (const n of writes) {
    const a = envs[n].answers;
    let urlOk = false;
    try { const u = new URL(a['portalUrl'] || ''); urlOk = u.protocol === 'http:' || u.protocol === 'https:'; } catch {}
    if (!urlOk) {
      showToast(`❌ بيئة «${n}»: رابط التطبيق ناقص أو غير صحيح — افتحها من صفحة إدارة البيئات وكمّلها`, 'error');
      return;
    }
    if (!envs[n].users.some(u => String(u.handle || '').trim())) {
      showToast(`❌ بيئة «${n}»: محتاجة مستخدم اختبار واحداً على الأقل — افتحها من صفحة إدارة البيئات`, 'error');
      return;
    }
  }

  const projectConfig = buildProjectConfig();
  const environments = {};
  for (const n of writes) environments[n] = buildEnvConfig(n);
  // Every op is explicit and pre-confirmed: renames derive from the rename
  // dialog's session changes, deletes accumulated through the delete dialog.
  // confirmed: true is the consent the dialogs gathered, made wire-visible —
  // the server refuses any op without it.
  const ops = {
    renames: deriveRenames(),
    deletes: pendingDeletes.map(name => ({ name, confirmed: true })),
  };

  if (MODE === 'local') {
    try {
      const r = await apiFetch('/api/save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ projectConfig, environments, ops, secrets: buildSecretsPayload() }),
      });
      const res = await r.json();
      if (res.ok) {
        finishWizard();
        setTimeout(() => apiFetch('/api/done').catch(() => {}), 1500);
      } else { showToast('❌ ' + (res.error || 'خطأ'), 'error'); }
    } catch(e) { showToast('❌ ' + e.message, 'error'); }
  } else {
    // Web mode: no server — download every file
    dlJSON(projectConfig, 'project.json');
    Object.keys(environments).forEach((n, i) => {
      setTimeout(() => dlJSON(environments[n], `${n}.json`), 300 * (i + 1));
    });
    showToast('✅ تم تحميل الملفات!');
  }
}

/**
 * Terminal done state. The server exits right after save (one-shot, per-run
 * token) — so every editing surface must go away with it: steps track, header
 * pill, footer buttons. What remains is a static success screen with no way
 * to fire another API call.
 */
function finishWizard() {
  finished = true;
  document.getElementById('steps-scroll').classList.remove('show');
  document.getElementById('hdr-pill').classList.remove('show');
  document.getElementById('prog-fill').style.width = '100%';
  document.getElementById('card').innerHTML =
    '<div class="paste-mode"><h2>✅ تم الإعداد بنجاح</h2>' +
    '<p>تم حفظ الملفات وإغلاق خادم المعالج تلقائياً — أغلق هذا التبويب وارجع إلى التيرمنال.</p>' +
    '<p style="font-size:13px;color:var(--text-3)">لأي تعديل لاحق (إضافة مستخدمين مثلاً) شغّل المعالج من جديد — سيحمّل الإعدادات المحفوظة ويكمل من حيث وقفت.</p>' +
    '</div>';
  showToast('تم الحفظ بنجاح!', 'success');
  window.scrollTo({ top: 0 });
}

function dlJSON(data, name) {
  const a = Object.assign(document.createElement('a'), {
    href: URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})),
    download: name,
  });
  a.click(); URL.revokeObjectURL(a.href);
}

/* ── Utils ───────────────────────────────────────────────────────────────── */
function fmtBytes(b) {
  if (b < 1024) return b + ' B';
  if (b < 1048576) return (b/1024).toFixed(1)+' KB';
  return (b/1048576).toFixed(1)+' MB';
}

let _tt;
function showToast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast show${type ? ' ' + type : ''}`;
  clearTimeout(_tt); _tt = setTimeout(() => t.classList.remove('show'), 3000);
}

/* ── Boot ─────────────────────────────────────────────────────────────────── */
init();
</script>
