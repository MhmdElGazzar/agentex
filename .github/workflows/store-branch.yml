# Rebuilds the `store` branch — the branch the Claude plugin directory follows — on every
# push to main: main's tree minus development-only paths (evals, tests, CI, .gitattributes).
# The exclusion list and the 512-file guard live in scripts/store/sync_store_branch.js.
name: Sync store branch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: store-branch
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and push the store branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/store/sync_store_branch.js --source HEAD --push origin
