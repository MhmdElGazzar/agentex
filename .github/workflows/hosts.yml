# Builds one plugin branch per host from main on every push: `store` (Claude plugin
# directory), `copilot`, `devin`, `codex`. Each host's conversion lives in
# hosts/<host>/host.json; the builder is scripts/hosts/build_host.js. Hosts build
# independently — one failing host never blocks the others — and a host whose guards
# find a problem publishes nothing.
name: Build host branches

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The suite gates the publish: a red run here leaves every host branch as it was.
  test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run the test suite
        run: node scripts/run-tests.js
  build:
    needs: test
    # Only main is ever published — a manual run from any other ref does nothing.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: [claude, copilot, devin, codex]
    concurrency:
      group: host-branch-${{ matrix.host }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and publish the ${{ matrix.host }} branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/hosts/build_host.js --host "${{ matrix.host }}" --source HEAD --push origin
